<!doctype html><html lang="en"><head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FigureSlide</title></head>
<body class="pn-base"><div id="root"></div><script src="../../vendor/react.production.min.js"></script><script src="../../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script>

  caption:'Figure 3. Login wireframe, first iteration.'},
  h('p',null,'Frame every screenshot with a border and a hard shadow. Always write alt text and a caption.'));
