<!doctype html><html lang="en"><head><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextField</title></head>
<body class="pn-base"><div id="root"></div><script src="../../vendor/react.production.min.js"></script><script src="../../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script>
<script>
const P = window.Pane, h = React.createElement;
const App = () => h('div',{style:{display:'grid',gap:24,maxWidth:420}},
  h(P.TextField,{label:'Email address',hint:'We only use it to send your receipt.',type:'email',placeholder:'name@example.com'}),
  h(P.TextField,{label:'Course code',error:'Enter a code like IK123A.',defaultValue:'ik'}));
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
