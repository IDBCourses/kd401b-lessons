<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pane slides starter</title>
<link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/bundle.css">
<style>html,body{margin:0;height:100%;background:var(--surface-300)}#stage{position:fixed;inset:0;overflow:hidden}#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px}</style></head>
<body class="pn-base"><div id="stage"><div id="deck"></div></div>
<script src="../vendor/react.production.min.js"></script><script src="../vendor/react-dom.production.min.js"></script><script src="../components/bundle.js"></script>
<script>
const P=window.Pane,h=React.createElement;
const slides=[
 h(P.TitleSlide,{title:['Designing','with systems'],subtitle:'A starter deck made with Pane',meta:'GUI course · Malmö University'}),
 h(P.ContentSlide,{title:['One idea','per slide'],number:2,footer:'Pane',aside:'Keep body text at 36px or larger.',asideTitle:'Rule'},'Tokens, not hex values. Every pairing checked.'),
 h(P.SectionSlide,{title:['Part two'],number:3,tone:'teal'}),
 h(P.QuoteSlide,{quote:'Accessibility is a design goal, not a feature.',source:'Course principle',number:4})
];
let i=0;const deck=document.getElementById('deck'),root=ReactDOM.createRoot(deck);
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform='translate(-50%,-50%) scale('+s+')'}
function show(){root.render(slides[i]);location.hash=i+1}
addEventListener('resize',fit);
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))i=Math.min(i+1,slides.length-1);else if(['ArrowLeft','PageUp'].includes(e.key))i=Math.max(i-1,0);else if(e.key==='t'){const d=document.documentElement,o=['light','dark','contrast'];d.dataset.theme=o[(o.indexOf(d.dataset.theme)+1)%3];return}else return;show()});
fit();show();
</script></body></html>
