<style>
/* styles used only by this lecture: layout only, colours and sizes from Pane tokens.
   Exception: the colour demos (named colours, HSL, the SVG circle) show literal CSS colour values,
   because those values are what the slide teaches. */

/* ---------- The example site: the A3 portfolio template's blog page, drawn in Pane colours ----------
   --accent can be set on .site (custom properties demo); it defaults to plum. */
.site{background:var(--surface-100);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);font-family:var(--font-text);font-size:28px;line-height:38px;overflow:hidden;text-align:left}
.site-head{background:var(--accent,var(--plum));color:var(--on-plum);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:center;gap:var(--space-5);flex-wrap:wrap}
.site-title{font:700 36px/44px var(--font-display);margin:0}
.site-head ul{display:flex;gap:var(--space-5);list-style:none;margin:0;padding:0}
.site-head a{color:inherit;font-family:var(--font-display);font-weight:500}
.site-main{padding:var(--space-6)}
.site-card{background:var(--surface-200);border:2px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6)}
.site-h2{font:700 36px/44px var(--font-display);margin:0 0 var(--space-2)}
.site-meta{color:var(--ink-muted);margin:0 0 var(--space-3);font-family:var(--font-display);font-weight:500}
.site-card p{margin:0 0 var(--space-3)}
.site-card > :last-child{margin-bottom:0}
.site-foot{padding:var(--space-4) var(--space-6);border-top:2px solid var(--border);color:var(--ink-muted);font-family:var(--font-display);font-weight:500}
.site-btn{font:600 28px/36px var(--font-display);background:var(--accent,var(--plum));color:var(--on-plum);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-2) var(--space-5);min-height:var(--target-min);cursor:pointer}
.site.compact .site-meta,.site.compact .site-foot{display:none}
.mock-label{font:500 28px/38px var(--font-display);margin:0 0 var(--space-3)}

/* peel the layers: "CSS off" drops every style back to the browser's defaults */
.peel-frame{background:var(--surface-200);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md)}
.peel-frame .site{box-shadow:none;border:0}
.site.bare,.site.bare *{all:revert}
.site.bare{display:block;font-size:28px;line-height:1.3;padding:var(--space-4) var(--space-5)}
.site.bare .site-title{font-size:2em;font-weight:700;margin:.4em 0}
.site.bare .site-h2{font-size:1.5em;font-weight:700;margin:.6em 0 .3em}
.site.bare button{font-size:28px}
.toggles{display:flex;flex-direction:column;gap:var(--space-4)}

/* native checkboxes at slide size */
.check{display:flex;align-items:center;gap:var(--space-4);font:500 36px/44px var(--font-display);cursor:pointer;min-height:var(--target-min)}
.check input{width:40px;height:40px;margin:0;accent-color:var(--plum);flex:none}

/* real button vs fake button */
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7)}
.twobtn .pn-card{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-5)}
.twobtn .site-btn{font-size:36px;line-height:44px;padding:var(--space-4) var(--space-6);display:inline-block}
.count{font:500 32px/40px var(--font-display);margin:0}
.btn-fake{user-select:none}

/* anatomy of an element: an annotated line of code */
.anat{display:inline-flex;flex-direction:column;gap:var(--space-5);align-items:flex-start}
.anat-row{display:flex;align-items:flex-start;gap:var(--space-3)}
.seg{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.seg code{font:400 64px/96px var(--font-mono);padding:0 var(--space-3);border:2px solid var(--ink);border-radius:var(--radius-sm);white-space:pre;color:var(--ink)}
.seg-tag code{background:var(--plum-tint)}
.seg-text code{background:var(--pink-tint)}
.seg code .attr{background:var(--teal-tint);outline:2px dashed var(--ink);outline-offset:-2px;padding:0 4px}
.seg-label{font:600 36px/44px var(--font-display);text-align:center}
.seg-label small{display:block;font-weight:500;font-size:28px;line-height:38px;color:var(--ink-muted)}
.anat-whole{font:600 36px/44px var(--font-display);border-top:4px solid var(--ink);padding-top:var(--space-2);align-self:stretch;text-align:center}

/* SVG fun fact */
.svgdemo{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--space-7);align-items:center}
.svgdemo svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto;background:var(--surface-200);border:2px solid var(--ink)}

/* anatomy of a CSS rule: code lines with labels beside them */
.rule{display:grid;grid-template-columns:auto 1fr;gap:var(--space-3) var(--space-6);align-items:center;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-5) var(--space-6)}
.rule code{font:400 40px/56px var(--font-mono);white-space:pre;color:var(--ink)}
.rule span{font:500 28px/38px var(--font-display);color:var(--ink-muted);white-space:nowrap}
.rule span::before{content:"← "}

.rulegrid{display:grid;grid-template-columns:auto 1fr;gap:var(--space-8);align-items:start}
/* core properties */
.props{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5) var(--space-8);margin:0}
.props div{margin:0}
.props dt{font:400 32px/44px var(--font-mono)}
.props dd{margin:0;font-size:32px;line-height:44px;color:var(--ink-muted)}

/* selector playground */
.play{display:grid;grid-template-columns:1fr 1.25fr;gap:var(--space-7);align-items:start}
.selbtns{display:flex;flex-wrap:wrap;gap:var(--space-3);margin:0 0 var(--space-5)}
.selbtns .pn-btn{font-family:var(--font-mono);font-weight:400;font-size:32px;line-height:40px;padding:var(--space-3) var(--space-5)}
.selbtns .pn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}
.codelines{margin:0;padding:var(--space-4) 0;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);font:400 28px/40px var(--font-mono);color:var(--ink)}
.codelines div{white-space:pre;padding:0 var(--space-5);border-left:8px solid transparent}
.codelines div.hit{background:var(--plum-tint);border-left-color:var(--ink);font-weight:700}
.selnote{font-size:32px;line-height:46px;margin:0}

/* cascade puzzles */
.puzzle{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7);align-items:start}
.puzzle .stack{gap:var(--space-5)}
.puzzle p{margin:0}

/* named colours */
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-5);margin:0;padding:0;list-style:none}
.swatches li{display:flex;flex-direction:column;gap:var(--space-3)}
.sw{display:block;height:160px;border:2px solid var(--ink)}
.swatches code{font:400 28px/38px var(--font-mono)}

/* hex and rgb */
.hexdemo{display:grid;grid-template-columns:420px 1fr;gap:var(--space-8);align-items:center}
.bigsw{height:380px;background:var(--plum);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md)}
.notation{font:400 56px/72px var(--font-mono);margin:0}
.hexpairs{display:flex;gap:var(--space-4);margin:var(--space-3) 0 var(--space-6)}
.hexpairs span{display:flex;flex-direction:column;align-items:center;font:400 44px/56px var(--font-mono);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);background:var(--surface-200);color:var(--ink)}
.hexpairs small{font:500 28px/38px var(--font-display);color:var(--ink-muted)}

/* sliders (HSL and custom properties) */
.sliders{display:flex;flex-direction:column;gap:var(--space-5)}
.slider label{display:flex;justify-content:space-between;font:500 32px/40px var(--font-display)}
.slider output{font-family:var(--font-mono);font-weight:400}
.slider input{width:100%;height:var(--target-min);margin:0;accent-color:var(--plum)}
.hsl-demo{display:grid;grid-template-columns:1fr 1.25fr;gap:var(--space-8);align-items:start}
.swrow{display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap}
.hsl-btn{font:600 36px/44px var(--font-display);color:var(--on-plum);background:var(--bg);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-4) var(--space-6);min-height:var(--target-min);cursor:pointer}
.hsl-btn:hover,.hsl-btn.is-hover{background:var(--bg-hover)}
.ratio{font:500 32px/44px var(--font-display);margin:0}
.ratio b{font-variant-numeric:tabular-nums}
.ratio .ok{color:var(--success)}
.ratio .bad{color:var(--danger)}

/* custom properties */
.vars-demo{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7);align-items:start}

/* JavaScript toggle */
.js-demo{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--space-7);align-items:start}
.js-demo .site{font-size:28px}

/* steps lists */
.steps{margin:0;padding-left:1.2em;font-size:36px;line-height:52px}
.steps li{margin-bottom:var(--space-3)}
.steps li::marker{font-family:var(--font-display);font-weight:700}
.steps code{font-family:var(--font-mono);font-size:32px}

/* canvas link card */
.linkcard{position:relative}
.linkcard a{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:52px}
.linkcard a::after{content:"";position:absolute;inset:0}
.linkcard p{margin-top:var(--space-2)}

/* inline code in body text and cards */
.pn-slide p code,.pn-slide li code,.pn-card__title code{font-family:var(--font-mono);font-size:.9em}
</style>

<script src="../shared/pane/vendor/react.production.min.js"></script>

<script>
(function(){
"use strict";
var P=window.Pane,h=React.createElement,useState=React.useState;
var FOOT="KD401B · HTML, CSS and colour";
var CANVAS_EX="https://mau.instructure.com/courses/22861/pages/exercise-colour-in-html-+-css";

function card(title,body,tone){return h(P.Card,{title:title,tone:tone||"paper"},body)}
/* solid-colour card (see "Solid-fill cards" in shared/deck.css): fill is plum | teal | pink */
function solid(title,body,fill){return h(P.Card,{title:title,className:"fill-"+fill},body)}
function p(t,cls){return h("p",cls?{className:cls}:null,t)}
function c(t){return h("code",null,t)}
function code(label,text){return h(P.CodeBlock,{size:"slide",label:label},text)}
function stop(e){e.preventDefault()}

/* ---------- Colour maths for the contrast readouts (WCAG 2 relative luminance) ---------- */
function hslToRgb(hu,s,l){
  s/=100;l/=100;
  var a=s*Math.min(l,1-l);
  function f(n){var k=(n+hu/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}
  return [f(0)*255,f(8)*255,f(4)*255];
}
function lum(rgb){
  return rgb.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)})
            .reduce(function(t,v,i){return t+v*[0.2126,0.7152,0.0722][i]},0);
}
/* contrast of white text on an HSL colour */
function whiteOn(hu,s,l){return 1.05/(lum(hslToRgb(hu,s,l))+0.05)}
/* "White text on …: 7.2:1, passes" — never colour alone: a symbol and a word as well */
function Ratio(props){
  var r=props.ratio,ok=r>=4.5;
  return h("p",{className:"ratio"},props.label+": ",h("b",null,r.toFixed(1)+":1")," ",
    h("span",{className:ok?"ok":"bad"},ok?"✓ passes 4.5:1":"✗ below 4.5:1"));
}
function hsl(hu,s,l){return "hsl("+hu+" "+s+"% "+l+"%)"}

/* ---------- The example site ----------
   The A3 portfolio template's blog page (header, nav, article, footer), styled with Pane's colours.
   props: theme (light | dark, optional), cls, style, extra (more content in the article) */
function Site(props){
  return h("div",{className:"site"+(props.cls?" "+props.cls:""),"data-theme":props.theme||null,style:props.style},
    h("div",{className:"site-head"},
      h("p",{className:"site-title"},"Blog Site Title"),
      h("nav",{"aria-label":"Example site"},h("ul",null,["Home","About","Contact"].map(function(t){
        return h("li",{key:t},h("a",{href:"#",tabIndex:-1,onClick:stop},t))})))),
    h("div",{className:"site-main"},
      h("div",{className:"site-card"},
        h("p",{className:"site-h2"},"Title of the First Blog Post"),
        h("p",{className:"site-meta"},"November 11, 2025 by Author Name"),
        p("This is the introduction of the first blog post."),
        props.extra)),
    h("div",{className:"site-foot"},"© 2025 Blog Site. All rights reserved."));
}

/* ---------- Real button vs fake button ---------- */
function TwoButtons(){
  var a=useState(0),b=useState(0);
  return h("div",{className:"twobtn"},
    h(P.Card,{title:"A real button"},
      h(P.CodeBlock,{size:"slide"},"<button>Save</button>"),
      h("button",{type:"button",className:"site-btn",onClick:function(){a[1](a[0]+1)}},"Save"),
      h("p",{className:"count","aria-live":"polite"},"Pressed "+a[0]+(a[0]===1?" time":" times"))),
    h(P.Card,{title:"A div dressed as one"},
      h(P.CodeBlock,{size:"slide"},'<div class="btn">Save</div>'),
      h("div",{className:"site-btn btn-fake",onClick:function(){b[1](b[0]+1)}},"Save"),
      h("p",{className:"count","aria-live":"polite"},"Pressed "+b[0]+(b[0]===1?" time":" times"))));
}

/* ---------- Peel the layers: switch CSS and JavaScript off ---------- */
function Peel(){
  var cs=useState(true),js=useState(true),likes=useState(0);
  var like=h("button",{type:"button",className:"site-btn",onClick:function(){if(js[0])likes[1](likes[0]+1)}},
    "Like ("+likes[0]+")");
  return h("div",{className:"wide grid2"},
    h("div",{className:"stack"},
      h("div",{className:"toggles"},
        h("label",{className:"check"},h("input",{type:"checkbox",checked:cs[0],onChange:function(e){cs[1](e.target.checked)}}),"CSS: how it looks"),
        h("label",{className:"check"},h("input",{type:"checkbox",checked:js[0],onChange:function(e){js[1](e.target.checked)}}),"JavaScript: what it does")),
      p(!cs[0]?"Without CSS: the browser's default look. Every word is still there, in order."
        :!js[0]?"Without JavaScript: it looks the same, but the Like button no longer does anything."
        :"Switch each layer off and see what's left. Then press Like.")),
    h("div",{className:"peel-frame","data-theme":"light"},
      h(Site,{cls:cs[0]?null:"bare",extra:like})));
}

/* ---------- Selector playground ---------- */
var LINES=[
  '<nav>',
  '  <a href="/">Home</a>',
  '  <a href="/about">About</a>',
  '</nav>',
  '<main id="main">',
  '  <h2>Projects</h2>',
  '  <p>Things I have made.</p>',
  '  <article class="card">',
  '    <h3>Colour study</h3>',
  '    <p>Two palettes, one page.</p>',
  '    <a href="/colour">Read more</a>',
  '  </article>',
  '</main>'
];
var SELECTORS=[
  {sel:"p",hits:[6,9],note:"An element selector: every <p> on the page."},
  {sel:".card",hits:[7,8,9,10,11],note:"A class selector: every element with class=\"card\", and what's inside it."},
  {sel:"#main",hits:[4,5,6,7,8,9,10,11,12],note:"An id selector: the one element with id=\"main\". Ids are unique, so use them sparingly."},
  {sel:"a",hits:[1,2,10],note:"Every link, wherever it is."},
  {sel:"nav a",hits:[1,2],note:"A descendant selector: only links inside a <nav>."}
];
function Playground(){
  var s=useState(0),cur=SELECTORS[s[0]];
  return h("div",{className:"wide play"},
    h("div",null,
      h("div",{className:"selbtns",role:"group","aria-label":"Selectors"},SELECTORS.map(function(x,i){
        return h("button",{key:x.sel,type:"button",className:"pn-btn pn-btn--secondary","aria-pressed":i===s[0]?"true":"false",onClick:function(){s[1](i)}},x.sel+" { }");
      })),
      p(cur.note,"selnote")),
    h("div",{className:"codelines",role:"img","aria-label":"index.html, with the lines that "+cur.sel+" selects highlighted"},
      LINES.map(function(t,i){return h("div",{key:i,className:cur.hits.indexOf(i)>=0?"hit":null},t)})));
}

/* ---------- Which rule wins? ---------- */
var PUZZLES=[
  {id:"p1",label:"Puzzle 1",code:'<p>Hello</p>\n\np { color: purple; }\np { color: teal; }',
   answer:"Teal. Both rules have the same selector, so the later one wins."},
  {id:"p2",label:"Puzzle 2",code:'<p class="note">Hello</p>\n\n.note { color: teal; }\np { color: purple; }',
   answer:"Teal. A class is more specific than an element, so it wins even though it comes first."},
  {id:"p3",label:"Puzzle 3",code:'<p id="intro" class="note">Hello</p>\n\n#intro { color: purple; }\n.note { color: teal; }',
   answer:"Purple. An id beats a class. That's why we style with classes: rules on ids are hard to override."}
];
function Puzzle(props){
  var s=useState(false),shown=s[0];
  return h("div",{className:"puzzle"},
    code("index.html and style.css",props.code),
    h("div",{className:"stack"},
      p("What colour is the text?","lead"),
      shown?h(P.Alert,{tone:"info",title:"Answer"},props.answer):null,
      h("div",null,h(P.Button,{variant:shown?"secondary":"primary",onClick:function(){s[1](!shown)}},shown?"Hide the answer":"Show the answer"))));
}

/* ---------- HSL: nudge the lightness ---------- */
function Slider(props){
  var id="sl-"+props.id;
  return h("div",{className:"slider"},
    h("label",{htmlFor:id},h("span",null,props.label),h("output",{htmlFor:id},props.value+props.unit)),
    h("input",{id:id,type:"range",min:props.min||0,max:props.max,value:props.value,onChange:function(e){props.set(+e.target.value)}}));
}
function HslDemo(){
  var H=useState(270),S=useState(52),L=useState(34),D=useState(10);
  var hl=Math.max(0,L[0]-D[0]);
  var base=hsl(H[0],S[0],L[0]),hover=hsl(H[0],S[0],hl);
  return h("div",{className:"wide hsl-demo"},
    h("div",{className:"sliders"},
      h(Slider,{id:"h",label:"Hue",value:H[0],set:H[1],max:360,unit:"°"}),
      h(Slider,{id:"s",label:"Saturation",value:S[0],set:S[1],max:100,unit:"%"}),
      h(Slider,{id:"l",label:"Lightness",value:L[0],set:L[1],max:100,unit:"%"}),
      h(Slider,{id:"d",label:"Hover: darker by",value:D[0],set:D[1],max:40,unit:" points"})),
    h("div",{className:"stack"},
      code("style.css",".button {\n  background-color: "+base+";\n}\n.button:hover {\n  background-color: "+hover+";\n}"),
      h("div",{className:"swrow",style:{"--bg":base,"--bg-hover":hover}},
        h("button",{type:"button",className:"hsl-btn"},"Hover me"),
        h("span",{className:"hsl-btn is-hover","aria-hidden":"true"},"Hover")),
      h("div",null,
        h(Ratio,{label:"White text, normal",ratio:whiteOn(H[0],S[0],L[0])}),
        h(Ratio,{label:"White text, hover",ratio:whiteOn(H[0],S[0],hl)}))));
}

/* ---------- Custom properties: change the palette in one place ---------- */
function VarsDemo(){
  var H=useState(270);
  var accent=hsl(H[0],55,35);
  return h("div",{className:"wide vars-demo"},
    h("div",{className:"stack"},
      code("style.css",":root {\n  --accent: "+accent+";\n}\nheader, button {\n  background-color: var(--accent);\n}"),
      h(Slider,{id:"acc",label:"Hue of --accent",value:H[0],set:H[1],max:360,unit:"°"}),
      h(Ratio,{label:"White text on --accent",ratio:whiteOn(H[0],55,35)})),
    h(Site,{style:{"--accent":accent},extra:h("button",{type:"button",className:"site-btn"},"Subscribe")}));
}

/* ---------- JavaScript: a button that swaps the stylesheet ----------
   The demo swaps a data-theme attribute; the code on the slide swaps the <link>'s href.
   Same idea: one switch, a whole palette changes. */
function JsDemo(){
  var d=useState(false),dark=d[0];
  return h("div",{className:"wide js-demo"},
    h("div",{className:"stack"},
      code("index.html",'<link id="palette" rel="stylesheet" href="light.css">\n<button id="theme" type="button">Dark mode</button>'),
      code("script.js",'const link = document.querySelector("#palette");\nconst button = document.querySelector("#theme");\n\nbutton.addEventListener("click", function () {\n  const dark = link.getAttribute("href") === "dark.css";\n  link.setAttribute("href", dark ? "light.css" : "dark.css");\n});')),
    h(Site,{theme:dark?"dark":"light",cls:"compact",extra:h("button",{type:"button",className:"site-btn",onClick:function(){d[1](!dark)}},dark?"Light mode":"Dark mode")}));
}

{id:"cover",sec:"Opening",title:"From Figma to the browser",
 notes:"Yesterday was colour in Figma with Johannes. Today we build: what HTML, CSS and JavaScript each do, a first HTML page, the basics of CSS, and colour in CSS. This afternoon you put your palette from yesterday into your portfolio.",
 render:function(){return h(P.TitleSlide,{title:["From Figma","to the browser"],subtitle:"HTML, CSS, JavaScript and colour",meta:"David · KD401B HT26 · Week 46"})}},

{id:"hook",sec:"Opening",title:"What would it take to build this?",
 notes:"This is the portfolio template's page (the one in your A3 repository) with a palette in light and dark, like the ones you made in Figma yesterday. Ask: what would it take to build this? Collect answers: text and headings, colours, a nav, a button that switches between the two palettes. By the end of today we'll have touched each of them, and this afternoon you build your own version.",
 render:function(n){return h(P.ContentSlide,{title:"What would it take to build this?",number:n,footer:FOOT},

/* ===== Big picture ===== */

{id:"house",sec:"Big picture",title:"A house: plan, furniture, wiring",
 notes:"The floor plan has the walls and rooms (structure) and the labels for what goes where: chair here, table there. That's the content. It says nothing about how anything looks. CSS chooses the actual furniture. JavaScript is the wiring: flip a switch and something happens. You can change the furniture without moving a wall, and that's exactly how we'll do light and dark mode this afternoon.",
 render:function(n){return h(P.ContentSlide,{title:"A house: plan, furniture, wiring",tone:"plum",number:n,footer:FOOT},

    h(P.Card,{title:"CSS"},p("The furniture: the oak table, the green velvet chair. How it all looks.")),
    solid("JavaScript",p("The wiring: flip a switch and something happens."),"pink")))}},

{id:"semantic",sec:"Big picture",title:"Say what it's for",
 notes:"A good floor plan says chair, not brown thing with four legs. Semantic markup says what an element is for: its role and purpose, not its appearance. Browsers and screen readers rely on that role. Next slide: try it.",

{id:"real-button",sec:"Big picture",title:"Real button, fake button",demo:"Real vs fake button",

{id:"peel",sec:"Big picture",title:"Peel off the layers",demo:"Peel the layers",

      c("  font-size: 20px;"),h("span",null,"another declaration"),
      c("}"),h("span",null,"braces close the rule")),
    h("div",{className:"stack"},
      p("Link the stylesheet in the head:"),
      h(P.CodeBlock,{size:"slide",label:"index.html"},'<link rel="stylesheet"\n      href="style.css">'),
      p("Not style=\"…\" on each element.","muted"))))}},
