<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML, CSS and colour · KD401B Interaction Design: Graphical User Interfaces</title>
<link rel="stylesheet" href="../shared/pane/tokens/tokens.css">
<link rel="stylesheet" href="../shared/pane/components/bundle.css">

<style>
/* styles used only by this lecture: layout only, colours and sizes from Pane tokens.
   Exception: the colour demos (named colours, HSL, the SVG circle) show literal CSS colour values,
   because those values are what the slide teaches. */

/* ---------- The example site: the A3 portfolio template's blog page, drawn in Pane colours ----------
   --accent can be set on .site (custom properties demo); it defaults to plum. */
.site{background:var(--surface-100);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);font-family:var(--font-text);font-size:28px;line-height:38px;overflow:hidden;text-align:left}
.site-head{background:var(--accent,var(--plum));color:var(--on-plum);padding:var(--space-5) var(--space-6);display:flex;justify-content:space-between;align-items:center;gap:var(--space-5);flex-wrap:wrap}
.site-title{font:700 36px/44px var(--font-display);margin:0}
.site-head ul{display:flex;gap:var(--space-5);list-style:none;margin:0;padding:0}
.site-head a{color:inherit;font-family:var(--font-display);font-weight:500}
.site-main{padding:var(--space-6)}
.site-card{background:var(--surface-200);border:2px solid var(--border);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6)}
.site-h2{font:700 36px/44px var(--font-display);margin:0 0 var(--space-2)}
.site-meta{color:var(--ink-muted);margin:0 0 var(--space-3);font-family:var(--font-display);font-weight:500}
.site-card p{margin:0 0 var(--space-3)}
.site-card > :last-child{margin-bottom:0}
.site-foot{padding:var(--space-4) var(--space-6);border-top:2px solid var(--border);color:var(--ink-muted);font-family:var(--font-display);font-weight:500}
.site-btn{font:600 28px/36px var(--font-display);background:var(--accent,var(--plum));color:var(--on-plum);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-2) var(--space-5);min-height:var(--target-min);cursor:pointer}
.site.compact .site-meta,.site.compact .site-foot{display:none}
.mock-label{font:500 28px/38px var(--font-display);margin:0 0 var(--space-3)}

/* peel the layers: "CSS off" drops every style back to the browser's defaults */
.peel-frame{background:var(--surface-200);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md)}
.peel-frame .site{box-shadow:none;border:0}
.site.bare,.site.bare *{all:revert}
.site.bare{display:block;font-size:28px;line-height:1.3;padding:var(--space-4) var(--space-5)}
.site.bare .site-title{font-size:2em;font-weight:700;margin:.4em 0}
.site.bare .site-h2{font-size:1.5em;font-weight:700;margin:.6em 0 .3em}
.site.bare button{font-size:28px}
.toggles{display:flex;flex-direction:column;gap:var(--space-3)}

/* on/off switches (role="switch"): position of the knob and the word On/Off, not colour alone */
.toggle{display:flex;align-items:center;gap:var(--space-4);background:none;border:0;padding:var(--space-1) 0;color:inherit;font:500 36px/44px var(--font-display);cursor:pointer;min-height:var(--target-min);text-align:left}
.toggle-track{flex:none;width:96px;height:52px;box-sizing:border-box;border-radius:var(--radius-full);border:var(--border-width) solid var(--border-control);background:var(--surface-300);position:relative}
.toggle-thumb{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:var(--radius-full);background:var(--ink-muted);transition:left .15s}
.toggle[aria-checked="true"] .toggle-track{background:var(--plum);border-color:var(--ink)}
.toggle[aria-checked="true"] .toggle-thumb{left:48px;background:var(--on-plum)}
.toggle-state{font-family:var(--font-mono);font-weight:400;font-size:28px;color:var(--ink-muted);min-width:3ch}
.toggle:disabled{cursor:not-allowed}
.toggle:disabled .toggle-track{border-style:dashed}
.toggle:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.toggle-hint{display:block;margin:0 0 0 calc(96px + var(--space-4));font:500 28px/38px var(--font-display);color:var(--ink-muted)}
@media (prefers-reduced-motion:reduce){.toggle-thumb{transition:none}}

/* the house: a floor plan built up in three steps */
.house{display:grid;grid-template-columns:1fr 1.5fr;gap:var(--space-7);align-items:start}
.steps-btns{display:flex;flex-direction:column;gap:var(--space-3);margin:0 0 var(--space-5)}
.steps-btns .pn-btn{justify-content:flex-start;text-align:left}
.steps-btns .pn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}
.house-text{margin:0 0 var(--space-5)}
.plan{display:block;width:100%;height:auto;border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);background:var(--surface-200)}
.plan .floor{fill:var(--surface-200)}
.plan .wall{stroke:var(--ink);stroke-width:12;fill:none}
.plan .room{font:500 28px var(--font-display);fill:var(--ink-muted)}
.plan .lbl{font:400 28px var(--font-mono);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.plan .outline{fill:none;stroke:var(--ink-muted);stroke-width:3;stroke-dasharray:10 8}
.plan .sofa{fill:var(--plum);stroke:var(--ink);stroke-width:3}
.plan .cushion{fill:none;stroke:var(--on-plum);stroke-width:3}
.plan .table{fill:var(--pink);stroke:var(--ink);stroke-width:3}
.plan .chair{fill:var(--teal);stroke:var(--ink);stroke-width:3}
.plan .lamp{fill:var(--surface-300);stroke:var(--ink);stroke-width:3}
.plan .lamp.on{fill:var(--pink)}
.plan .on-plum{fill:var(--on-plum)}.plan .on-pink{fill:var(--on-pink)}.plan .on-teal{fill:var(--on-teal)}
.plan .glow{fill:var(--pink);opacity:.3}
.plan .wire{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:4 10;stroke-linecap:round}
.plan .switch{fill:var(--surface-100);stroke:var(--ink);stroke-width:3}
.plan .knob{fill:var(--ink)}

/* anatomy of an element: an annotated line of code */
.anat{display:inline-flex;flex-direction:column;gap:var(--space-5);align-items:flex-start}
.anat-row{display:flex;align-items:flex-start;gap:var(--space-3)}
.seg{display:flex;flex-direction:column;align-items:center;gap:var(--space-3)}
.seg code{font:400 64px/96px var(--font-mono);padding:0 var(--space-3);border:2px solid var(--ink);border-radius:var(--radius-sm);white-space:pre;color:var(--ink)}
.seg-tag code{background:var(--plum-tint)}
.seg-text code{background:var(--pink-tint)}
.seg code .attr-name{background:var(--teal-tint)}
.seg code .attr-val{background:var(--pink);color:var(--on-pink);font-weight:700}
.attr-break{display:flex;flex-direction:column;gap:var(--space-4);align-items:flex-start;margin-top:var(--space-6);padding-top:var(--space-5);border-top:2px dashed var(--border-control)}
.attr-break .h3{margin:0}
.seg-name code{background:var(--teal-tint)}
.seg-eq code{background:var(--surface-200)}
.seg-val code{background:var(--pink);color:var(--on-pink);font-weight:700;border-width:4px;box-shadow:var(--shadow-pane-sm)}
.seg-label{font:600 36px/44px var(--font-display);text-align:center}
.seg-label small{display:block;font-weight:500;font-size:28px;line-height:38px;color:var(--ink-muted)}
.anat-whole{font:600 36px/44px var(--font-display);border-top:4px solid var(--ink);padding-top:var(--space-2);align-self:stretch;text-align:center}

/* SVG fun fact */
.svgdemo{display:grid;grid-template-columns:1.15fr 1fr;gap:var(--space-7);align-items:start}
.svgdemo svg{width:200px;height:200px;flex:none;display:block;background:var(--surface-200);border:2px solid var(--ink)}
.svgside{display:flex;gap:var(--space-6);align-items:flex-start}
.svgside p{margin:0}
.reslinks{margin:var(--space-3) 0 0;padding-left:1.1em}

/* anatomy of a CSS rule: code lines with labels beside them */
.rule{display:grid;grid-template-columns:auto 1fr;gap:var(--space-3) var(--space-6);align-items:center;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-5) var(--space-6)}
.rule code{font:400 40px/56px var(--font-mono);white-space:pre;color:var(--ink)}
.rule span{font:500 28px/38px var(--font-display);color:var(--ink-muted);white-space:nowrap}
.rule span::before{content:"← "}

.rulegrid{display:grid;grid-template-columns:auto 1fr;gap:var(--space-8);align-items:start}
/* core properties */
.props{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5) var(--space-8);margin:0}
.props div{margin:0}
.props dt{font:400 32px/44px var(--font-mono)}
.props dd{margin:0;font-size:32px;line-height:44px;color:var(--ink-muted)}

/* selector playground */
.play{display:grid;grid-template-columns:1fr 1.25fr;gap:var(--space-7);align-items:start}
.selbtns{display:flex;flex-wrap:wrap;gap:var(--space-3);margin:0 0 var(--space-5)}
.selbtns .pn-btn{font-family:var(--font-mono);font-weight:400;font-size:32px;line-height:40px;padding:var(--space-3) var(--space-5)}
.selbtns .pn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}
.codelines{margin:0;padding:var(--space-4) 0;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);font:400 28px/40px var(--font-mono);color:var(--ink)}
.codelines div{white-space:pre;padding:0 var(--space-5);border-left:8px solid transparent}
.codelines div.hit{background:var(--plum-tint);border-left-color:var(--ink);font-weight:700}
.selnote{font-size:32px;line-height:46px;margin:0}

/* cascade puzzles */
.puzzle{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7);align-items:start}
.puzzle .stack{gap:var(--space-5)}
.puzzle p{margin:0}

/* named colours */
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-5);margin:0;padding:0;list-style:none}
.swatches li{display:flex;flex-direction:column;gap:var(--space-3)}
.sw{display:block;height:160px;border:2px solid var(--ink)}
.swatches code{font:400 28px/38px var(--font-mono)}

/* hex and rgb */
.rgbdemo{display:grid;grid-template-columns:520px 1fr 1fr;gap:var(--space-7);align-items:start}
.venn{display:block;width:100%;height:auto;border:2px solid var(--ink);box-shadow:var(--shadow-pane-md)}
.venn g{isolation:isolate}
.venn circle{mix-blend-mode:screen}
.notation{font:400 48px/64px var(--font-mono);margin:0;white-space:nowrap}
.hexpairs{display:flex;gap:var(--space-4);margin:var(--space-3) 0 var(--space-5)}
.hexpairs span{display:flex;flex-direction:column;align-items:center;font:400 44px/56px var(--font-mono);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);background:var(--surface-200);color:var(--ink)}
.hexpairs small{font:500 28px/38px var(--font-display);color:var(--ink-muted)}

.sliders{display:flex;flex-direction:column;gap:var(--space-5)}
/* sliders whose track is a gradient of what each value would give (set as --track on the input) */
.slider label{display:flex;justify-content:space-between;gap:var(--space-4);font:500 32px/40px var(--font-display);margin-bottom:var(--space-2)}
.slider output{font-family:var(--font-mono);font-weight:400}
.slider input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:48px;margin:0;background:transparent;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:36px;box-sizing:border-box;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--track)}
.slider input::-moz-range-track{height:32px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--track)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:48px;margin-top:-8px;box-sizing:border-box;border:3px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-100);box-shadow:0 0 0 2px var(--surface-100)}
.slider input::-moz-range-thumb{width:16px;height:42px;border:3px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-100);box-shadow:0 0 0 2px var(--surface-100)}
.slider input:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.hsl-demo{display:grid;grid-template-columns:1fr 1.15fr;gap:var(--space-7);align-items:start}
.swrow{display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap}
.hsl-btn{font:600 36px/44px var(--font-display);color:var(--on-plum);background:var(--bg);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-4) var(--space-6);min-height:var(--target-min);cursor:pointer}
.hsl-btn:hover,.hsl-btn.is-hover{background:var(--bg-hover)}
.ratio{font:500 32px/44px var(--font-display);margin:0}
.ratio b{font-variant-numeric:tabular-nums}
.ratio .ok{color:var(--success)}
.ratio .bad{color:var(--danger)}

/* custom properties */
.vars-demo{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-7);align-items:start}

/* JavaScript toggle */
.js-demo{display:grid;grid-template-columns:1.6fr 1fr;gap:var(--space-7);align-items:start}
.js-demo .site{font-size:28px}

/* the parts of a page: code split into regions, and where each one shows up in a browser */
.parts{display:grid;grid-template-columns:1fr 500px;gap:var(--space-8);align-items:start}
.regions{display:grid;grid-template-columns:auto 1fr;gap:0 var(--space-5);align-items:stretch;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-4) 0}
.regions pre{margin:0;padding:var(--space-2) var(--space-5);font:400 34px/46px var(--font-mono);color:var(--ink);border-left:8px solid transparent}
.regions .lab{padding:var(--space-2) var(--space-5) var(--space-2) 0;font:500 30px/40px var(--font-display);display:flex;flex-direction:column;justify-content:center}
.regions .lab b{font-weight:700}
.regions .r-head{background:var(--teal-tint);border-left-color:var(--ink)}
.regions .r-body{background:var(--plum-tint);border-left-color:var(--ink)}
.regions .lab.r-head,.regions .lab.r-body{border-left:0}
.browser{border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);background:var(--surface-300)}
.browser-tab{display:inline-block;margin:var(--space-3) 0 0 var(--space-3);padding:var(--space-2) var(--space-5);background:var(--teal-tint);color:var(--ink);border:2px solid var(--ink);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;font:500 28px/38px var(--font-display)}
.browser-view{background:var(--plum-tint);color:var(--ink);border-top:2px solid var(--ink);min-height:320px;padding:var(--space-5)}
.browser-view .h1like{font:700 56px/64px var(--font-text);margin:0}
.browser-key{display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-5)}
.browser-key span{font:500 32px/44px var(--font-display)}

/* default (browser) styles: everything reverted to the browser's own stylesheet, at slide scale */
.defaults{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5)}
.defaults .pn-card{padding:var(--space-5)}
.defaults .pn-card__title{margin-bottom:var(--space-2)}
.uabox{background:var(--surface-200);color:var(--ink);border:2px dashed var(--border-control);padding:0 var(--space-4);min-height:150px;display:flex;align-items:center}
.uabox .ua,.uabox .ua *{all:revert}
.uabox .ua{display:block;font-size:28px;line-height:1.3;width:100%}
.uabox .ua button{font-size:28px}
.uabox .ua li::marker{color:inherit}
.uabox .ua img{display:block;width:180px;height:auto;margin:var(--space-3) 0}
.defaults .desc{margin:var(--space-3) 0 0;font-size:28px;line-height:38px}

/* cascade answer key */
.key{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5)}
.ladder{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;font:400 32px/44px var(--font-mono);margin:var(--space-2) 0 0}

/* HSL: the colour and its hover state as two groups */
fieldset.group{margin:0;border:2px solid var(--ink);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-5) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3);min-width:0}
fieldset.group legend{font:600 32px/40px var(--font-display);padding:0 var(--space-2)}
.seg-choice{display:flex;gap:var(--space-3);flex-wrap:wrap}
.seg-choice .pn-btn{font-size:28px;line-height:36px;padding:var(--space-2) var(--space-5)}
.seg-choice .pn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}

/* steps lists */
.steps{margin:0;padding-left:1.2em;font-size:36px;line-height:52px}
.steps li{margin-bottom:var(--space-3)}
.steps li::marker{font-family:var(--font-display);font-weight:700}
.steps code{font-family:var(--font-mono);font-size:32px}

/* canvas link card */
.linkcard{position:relative}
.linkcard a{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:52px}
.linkcard a::after{content:"";position:absolute;inset:0}
.linkcard p{margin-top:var(--space-2)}

/* inline code in body text and cards */
.pn-slide p code,.pn-slide li code,.pn-card__title code{font-family:var(--font-mono);font-size:.9em}
</style>

<script src="../shared/pane/vendor/react.production.min.js"></script>
<script src="../shared/pane/vendor/react-dom.production.min.js"></script>

<script>
(function(){
"use strict";
var P=window.Pane,h=React.createElement,useState=React.useState;
var FOOT="KD401B · HTML, CSS and colour";
var CANVAS_EX="https://mau.instructure.com/courses/22861/pages/exercise-colour-in-html-+-css";

function card(title,body,tone){return h(P.Card,{title:title,tone:tone||"paper"},body)}
/* solid-colour card (see "Solid-fill cards" in shared/deck.css): fill is plum | teal | pink */
function solid(title,body,fill){return h(P.Card,{title:title,className:"fill-"+fill},body)}
function p(t,cls){return h("p",cls?{className:cls}:null,t)}
function c(t,props){return h("code",props||null,t)}
function code(label,text){return h(P.CodeBlock,{size:"slide",label:label},text)}
function stop(e){e.preventDefault()}

/* ---------- Colour maths for the contrast readouts (WCAG 2 relative luminance) ---------- */
function hslToRgb(hu,s,l){
  s/=100;l/=100;
  var a=s*Math.min(l,1-l);
  function f(n){var k=(n+hu/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))}
  return [f(0)*255,f(8)*255,f(4)*255];
}
function lum(rgb){
  return rgb.map(function(v){v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)})
            .reduce(function(t,v,i){return t+v*[0.2126,0.7152,0.0722][i]},0);
}
/* contrast of white text on an HSL colour */
function whiteOn(hu,s,l){return 1.05/(lum(hslToRgb(hu,s,l))+0.05)}
/* "White text on …: 7.2:1, passes" — never colour alone: a symbol and a word as well */
function Ratio(props){
  var r=props.ratio,ok=r>=4.5;
  return h("p",{className:"ratio"},props.label+": ",h("b",null,r.toFixed(1)+":1")," ",
    h("span",{className:ok?"ok":"bad"},ok?"✓ passes 4.5:1":"✗ below 4.5:1"));
}
function hsl(hu,s,l){return "hsl("+hu+" "+s+"% "+l+"%)"}

/* ---------- The example site ----------
   The A3 portfolio template's blog page (header, nav, article, footer), styled with Pane's colours.
   props: theme (light | dark, optional), cls, style, extra (more content in the article) */
function Site(props){
  return h("div",{className:"site"+(props.cls?" "+props.cls:""),"data-theme":props.theme||null,style:props.style},
    h("div",{className:"site-head"},
      h("p",{className:"site-title"},"Blog Site Title"),
      h("nav",{"aria-label":"Example site"},h("ul",null,["Home","About","Contact"].map(function(t){
        return h("li",{key:t},h("a",{href:"#",tabIndex:-1,onClick:stop},t))})))),
    h("div",{className:"site-main"},
      h("div",{className:"site-card"},
        h("p",{className:"site-h2"},"Title of the First Blog Post"),
        h("p",{className:"site-meta"},"November 11, 2025 by Author Name"),
        p("This is the introduction of the first blog post."),
        props.extra)),
    h("div",{className:"site-foot"},"© 2025 Blog Site. All rights reserved."));
}

/* ---------- The house: plan, furniture, wiring ----------
   Step 0: the plan (HTML) only labels what goes where. Step 1 adds the furniture (CSS).
   Step 2 adds the wiring (JavaScript): a switch that turns the lamp on. */
var HOUSE_STEPS=[
  {label:"1. HTML: the floor plan",text:"The rooms, and labels for what goes where. Nothing about how anything looks."},
  {label:"2. CSS: the furniture",text:"The same plan, now furnished. Change the furniture without moving a wall."},
  {label:"3. JavaScript: the wiring",text:"Flip the switch and something happens."}
];
function House(){
  var st=useState(0),step=st[0],li=useState(false),lit=li[0];
  var css=step>=1,js=step>=2,on=js&&lit;
  /* a piece of furniture: a dashed outline with a label in the plan, a filled shape with CSS */
  function piece(key,x,y,w,hh,label,cls,txt,extra){
    return h("g",{key:key},

/* ===== CSS basics ===== */
{id:"css",sec:"CSS basics",title:"CSS basics",
 notes:"The furniture. How a rule is written, how to pick which elements it applies to, a handful of properties, and what happens when two rules disagree.",
 render:function(){return h(P.SectionSlide,{title:["CSS basics"],tone:"teal",footer:FOOT})}},

{id:"rule",sec:"CSS basics",title:"Anatomy of a rule",
 notes:"A rule is a selector, then curly braces, then declarations: property, colon, value, semicolon. Common mistakes: a missing semicolon (the next line is then ignored), a missing closing brace, and American spelling: it's color, not colour. Link the stylesheet from the head with a link element. Avoid style attributes on elements: one stylesheet for the whole site is easier to change.",
 render:function(n){return h(P.ContentSlide,{title:"Anatomy of a rule",number:n,footer:FOOT},
  h("div",{className:"wide rulegrid"},
    h("div",{className:"rule",role:"img","aria-label":"A CSS rule: selector p, then declarations color: purple and font-size: 20px inside curly braces"},
      c("p {"),h("span",null,"selector"),
      c("  color: purple;"),h("span",null,"property: value;"),
      c("  font-size: 20px;"),h("span",null,"another declaration"),
      c("}"),h("span",null,"braces close the rule")),
    h("div",{className:"stack"},
      p("Link the stylesheet in the head:"),
      h(P.CodeBlock,{size:"slide",label:"index.html"},'<link rel="stylesheet"\n      href="style.css">'),
      p("Not style=\"…\" on each element.","muted"))))}},

{id:"selectors",sec:"CSS basics",title:"Selectors pick elements",demo:"Selector playground",
 notes:"Click through the selectors; students can do the same on their laptops. p: every paragraph. .card: everything with class card. #main: the one element with that id. a: every link. nav a: only links inside nav (descendant selector). Rule of thumb: style with classes. Element selectors for sensible defaults, ids rarely.",
 render:function(n){return h(P.ContentSlide,{title:"Selectors pick elements",tone:"plum",number:n,footer:FOOT},
  h(Playground))}},

  h("dl",{className:"wide props"},[
    ["color: purple;","Text colour"],
    ["background-color: gold;","Background behind the element"],
    ["font-family: Georgia, serif;","Typeface, with fallbacks"],
    ["font-size: 20px;","Text size"],
    ["margin: 16px;","Space outside the element"],
    ["padding: 16px;","Space inside, around the content"]
  ].map(function(r){return h("div",{key:r[0]},h("dt",null,r[0]),h("dd",null,r[1]))})))}},

    return {id:z.id,label:z.label,content:h(Puzzle,{code:z.code,answer:z.answer})};
  }).concat([{id:"key",label:"Answer key",content:h(AnswerKey)}])})))}},

/* ===== Colour in CSS ===== */
{id:"colour",sec:"Colour in CSS",title:"Colour in CSS",
 notes:"From the simplest way to write a colour to the most designer-friendly. Yesterday's palette ends up as code.",
 render:function(){return h(P.SectionSlide,{title:["Colour in CSS"],tone:"pink",footer:FOOT})}},

{id:"named",sec:"Colour in CSS",title:"Named colours",
 notes:"CSS has about 150 named colours. rebeccapurple was added in memory of Rebecca Meyer, daughter of the CSS author Eric Meyer. They're fun and quick for testing, but limited: you can't ask for tomato, slightly darker. For a real palette you need numbers.",
 render:function(n){return h(P.ContentSlide,{title:"Named colours",number:n,footer:FOOT},
  h("div",{className:"wide stack"},
    h("ul",{className:"swatches"},["tomato","rebeccapurple","teal","gold","hotpink","cornflowerblue"].map(function(x){
      return h("li",{key:x},h("span",{className:"sw",style:{background:x},"aria-hidden":"true"}),c(x));
    })),
    p("Quick and fun, but you can't ask for “tomato, a bit darker”.")))}},

{id:"hex",sec:"Colour in CSS",title:"Hex and RGB: mixing light",demo:"RGB mixer",
 notes:"A screen mixes colour from red, green and blue light. It starts at plum from this course's design system. Each channel goes from 0 (off) to 255 (full); where all three circles overlap you see the mix. Plum is a lot of blue, some red, little green. Hex writes the same three numbers in base 16, as pairs from 00 to FF. This is what Figma gives you: copy the value from a colour style straight into your CSS. Try: all three at 255 gives white; all at 0 gives black. Reset goes back to plum.",
 render:function(n){return h(P.ContentSlide,{title:"Hex and RGB: mixing light",number:n,footer:FOOT},h(RgbMixer))}},

{id:"hsl",sec:"Colour in CSS",title:"HSL: nudge the lightness",demo:"HSL hover shade",
 notes:"HSL came up in Johannes's colour lecture: hue (around the colour wheel), saturation (grey to vivid) and lightness (black to white). The top group is the colour itself; the bottom group is its hover state, worked out from it. Usually that's a lightness change: darker on a light page, often lighter on a dark one. A saturation change is subtler; making it duller can read as disabled, so be careful with that one. Live: lower the lightness and watch the hover colour and its contrast. Each slider's track shows what you'd get at every position, given the other values. Reset goes back to plum. Hover the real button to see it. Ask: what happens to contrast if the lightness goes up to 60? Students can try it on their laptops.",
 render:function(n){return h(P.ContentSlide,{title:"HSL: nudge the lightness",number:n,footer:FOOT},h(HslDemo))}},

{id:"vars",sec:"Colour in CSS",title:"Define the palette once",demo:"Custom properties",
 notes:"Custom properties are like colour styles in Figma: name a colour once in :root (the html element, the top of the page), then use it everywhere with var(). Change it in one place and the whole page follows. Move the hue: header and button change together. Watch the contrast readout: some hues fail with white text at the same lightness (try yellow). This is how the afternoon's light and dark mode work: the second stylesheet only redefines the variables. Design systems in week 49 build on this.",
 render:function(n){return h(P.ContentSlide,{title:"Define the palette once",number:n,footer:FOOT},h(VarsDemo))}},
