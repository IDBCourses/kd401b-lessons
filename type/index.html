<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type · KD401B Interaction Design: Graphical User Interfaces</title>
<link rel="stylesheet" href="../shared/pane/tokens/tokens.css">
<link rel="stylesheet" href="../shared/pane/components/bundle.css">
<link rel="stylesheet" href="../shared/deck.css">
<style>
/* styles used only by this lecture: layout only, colours and sizes from Pane tokens.
   Exception: the type demos set literal font sizes, axes and line lengths, because those values are
   what the slide teaches. Roboto Flex is vendored in fonts/ (see fonts/FONTS.md). */
@font-face{font-family:"Roboto Flex";src:url(fonts/RobotoFlex-Variable.woff2) format("woff2");font-weight:100 1000;font-stretch:25% 151%;font-style:normal;font-display:swap}
.flex{font-family:"Roboto Flex",var(--font-display)}

/* on plum and teal slide grounds, ink-muted lacks contrast: muted labels take the slide's text colour */
.pn-slide--plum :is(.muted,.lbl,.figcap,.lm-info dt),.pn-slide--teal :is(.muted,.lbl,.figcap,.lm-info dt){color:inherit}

/* a link inside a slide title: the frame's own text colour, underlined */
.pn-frame a.title-link{color:inherit;text-decoration:underline;text-decoration-thickness:6px;text-underline-offset:.12em}
.pn-frame a.title-link:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}

/* inline code in body text and cards */
.pn-slide p code,.pn-slide li code,.pn-slide dd code,.pn-card__title code{font-family:var(--font-mono);font-size:.9em}

/* steps lists */
.steps{margin:0;padding-left:1.2em;font-size:36px;line-height:52px}
.steps li{margin-bottom:var(--space-3)}
.steps li::marker{font-family:var(--font-display);font-weight:700}
.steps code{font-family:var(--font-mono);font-size:32px}
.checks{list-style:none;margin:0;padding:0;font-size:36px;line-height:50px}
.checks li{display:flex;gap:var(--space-4);margin-bottom:var(--space-3)}
.checks li::before{content:"☐";font-family:var(--font-mono);flex:none}

/* canvas link card */
.linkcard{position:relative}
.linkcard a{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:52px}
.linkcard a::after{content:"";position:absolute;inset:0}
.linkcard p{margin-top:var(--space-2)}

/* ---------- One hierarchy, three layers ---------- */
.layers{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);background:var(--surface-100);color:var(--ink)}
.layers > div{padding:var(--space-4) var(--space-6);border-bottom:2px solid var(--border);display:flex;align-items:center;min-height:96px}
.layers > div:nth-last-child(-n+3){border-bottom:0}
.layers .lh{font:600 32px/40px var(--font-display);background:var(--surface-300);min-height:0}
.layers .lh small{font-weight:500;color:var(--ink-muted);margin-left:var(--space-3)}
.layers code{font:400 32px/44px var(--font-mono)}
.layers .s1{font:700 64px/72px "Roboto Flex",var(--font-display)}
.layers .s2{font:700 48px/56px "Roboto Flex",var(--font-display)}
.layers .s3{font:400 36px/48px "Roboto Flex",var(--font-display)}
.layers .s4{font:400 28px/38px "Roboto Flex",var(--font-display);color:var(--ink-muted)}
.layers-note{margin:var(--space-6) 0 0}

/* ---------- Today: the outline ---------- */
.today{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)}
.today ol{margin:0;padding-left:1.2em}
.today .pn-card__title small{display:block;font:500 28px/38px var(--font-display);opacity:.85}

/* ---------- Block and inline ---------- */
.flow{font-family:var(--font-text);font-size:32px;line-height:1.4}
.flow > *{margin:0 0 var(--space-3)}
.flow > :last-child{margin-bottom:0}
.flow h3{font:700 44px/1.2 var(--font-display)}
.flow ul{padding-left:1.4em}
.show .b{position:relative;outline:3px dashed var(--ink);outline-offset:2px;background:var(--plum-tint)}
.show .b::after{content:attr(data-tag);position:absolute;right:var(--space-2);top:0;font:400 28px/38px var(--font-mono);background:var(--surface-100);padding:0 var(--space-2)}
.show .i{outline:3px solid var(--ink);background:var(--teal-tint)}

/* ---------- Landmark map ---------- */
.lmap{display:grid;grid-template-columns:1.25fr 1fr;gap:var(--space-7);align-items:start}
.wire{display:grid;grid-template-columns:2fr 1fr;grid-template-areas:"head head" "main side" "foot foot";gap:var(--space-3);background:var(--surface-200);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);padding:var(--space-3)}
.lm{border:2px dashed var(--border-control);border-radius:var(--radius-sm);padding:var(--space-2);display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface-100)}
.lm.on{border:4px solid var(--ink);background:var(--plum-tint)}
.lm-head{grid-area:head;flex-direction:row;align-items:center;justify-content:space-between}
.lm-main{grid-area:main}.lm-side{grid-area:side;min-height:260px}.lm-foot{grid-area:foot}
.lm-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.lm-art{min-height:110px}
.lmbtn{align-self:flex-start;font:400 28px/36px var(--font-mono);color:var(--ink);background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:var(--space-1) var(--space-3);min-height:var(--target-min);cursor:pointer}
.lmbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}
.lmbtn:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.lm-info dl{margin:0;display:flex;flex-direction:column;gap:var(--space-4)}
.lm-info dt{font:600 28px/36px var(--font-display);color:var(--ink-muted)}
.lm-info dd{margin:0;font-size:36px;line-height:48px}
.lm-info .el{font:400 56px/64px var(--font-mono)}

/* ---------- Fix the outline ---------- */
.outline{display:grid;grid-template-columns:1.1fr 1fr;gap:var(--space-7);align-items:start}
.hlist{list-style:none;margin:0;padding:var(--space-3) 0;background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm)}
.hlist li{display:flex;align-items:center;gap:var(--space-4);padding:var(--space-1) var(--space-5)}
.hlist .tag{font:400 32px/44px var(--font-mono);min-width:4.5ch}
.hlist .txt{font:600 32px/44px var(--font-display);flex:1}
.lvlbtn{font:600 32px/1 var(--font-display);width:52px;height:52px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-100);color:var(--ink);cursor:pointer}
.lvlbtn:disabled{border-style:dashed;color:var(--ink-muted);cursor:not-allowed}
.lvlbtn:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.problems{margin:0;padding-left:1.1em;font-size:32px;line-height:44px}

/* default (browser) styles at slide scale, as in last week's deck */
.defaults{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5)}
.defaults .pn-card{padding:var(--space-5)}
.defaults .pn-card__title{margin-bottom:var(--space-2)}
.uabox{background:var(--surface-200);color:var(--ink);border:2px dashed var(--border-control);padding:0 var(--space-4);min-height:170px;display:flex;align-items:center}
.uabox .ua,.uabox .ua *:not(svg,svg *){all:revert}
.uabox .ua{display:block;font-size:28px;line-height:1.3;width:100%}
.uabox .ua svg{display:block;width:150px;height:80px;overflow:visible}
.uabox .ua figure{margin:var(--space-3) var(--space-5)}
.uabox .ua blockquote{margin:var(--space-3) var(--space-7)}
.uabox .ua ul,.uabox .ua ol,.uabox .ua p{margin:var(--space-3) 0}
.defaults .desc{margin:var(--space-3) 0 0;font-size:28px;line-height:38px}

/* placeholder image box, drawn like placehold.co's */
.ph{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;width:100%;background:var(--surface-300);color:var(--ink-muted);border:2px solid var(--ink);font:500 44px/52px var(--font-display)}
.figcap{font-size:28px;line-height:38px;color:var(--ink-muted);margin:var(--space-3) 0 0}
.emmet{display:grid;grid-template-columns:auto auto 1fr;gap:var(--space-4) var(--space-5);align-items:center;margin:0}
.emmet kbd,kbd.keys{font:400 32px/44px var(--font-mono);background:var(--surface-300);border:2px solid var(--ink);border-radius:var(--radius-sm);padding:0 var(--space-3);color:var(--ink)}
.emmet span{font:500 32px/44px var(--font-display);color:var(--ink-muted)}

/* units */
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5)}
.units dl{margin:0;display:flex;flex-direction:column;gap:var(--space-3)}
.units dt{font:400 36px/44px var(--font-mono)}
.units dd{margin:0;font-size:28px;line-height:38px}

/* sliders (as in last week's deck; the track here is a plain bar) */
.slider label{display:flex;justify-content:space-between;gap:var(--space-4);font:500 32px/40px var(--font-display);margin-bottom:var(--space-2)}
.slider output{font-family:var(--font-mono);font-weight:400}
.slider input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:48px;margin:0;background:transparent;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:24px;box-sizing:border-box;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-300)}
.slider input::-moz-range-track{height:20px;border:2px solid var(--ink);border-radius:var(--radius-sm);background:var(--surface-300)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:48px;margin-top:-14px;box-sizing:border-box;border:3px solid var(--ink);border-radius:var(--radius-sm);background:var(--plum);box-shadow:0 0 0 2px var(--surface-100)}
.slider input::-moz-range-thumb{width:16px;height:42px;border:3px solid var(--ink);border-radius:var(--radius-sm);background:var(--plum);box-shadow:0 0 0 2px var(--surface-100)}
.slider input:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
.sliders{display:flex;flex-direction:column;gap:var(--space-4)}

/* demo panels: text samples shown on a plain page */
.page{background:var(--surface-100);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);padding:var(--space-5) var(--space-6);overflow:hidden}
.demo2{display:grid;grid-template-columns:1fr 1.2fr;gap:var(--space-7);align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5)}
.lbl{font:500 28px/38px var(--font-display);color:var(--ink-muted);margin:0 0 var(--space-3)}
.lbl code{font-family:var(--font-mono);font-size:28px;color:var(--ink)}
.status{font:500 32px/44px var(--font-display);margin:var(--space-3) 0 0}
.status .ok{color:var(--success)}
.status .bad{color:var(--danger)}

/* em vs rem: nested boxes */
.nest{border:2px solid var(--border-control);border-radius:var(--radius-sm);padding:var(--space-1) var(--space-3);margin-top:var(--space-2);font-family:var(--font-display);font-weight:500;line-height:1.15}
.nest-top{border:0;padding:0;margin:0}

/* line length */
.measure{font-family:var(--font-text);font-size:28px;line-height:40px;margin:0}
.measure-wrap{height:440px}

/* clamp */
.clamp-h{font:700 1em/1.1 var(--font-display);margin:0}

/* type scale builder */
.scale-ctl{display:flex;flex-direction:column;gap:var(--space-5)}
.seg-choice{display:flex;gap:var(--space-3);flex-wrap:wrap}
.seg-choice .pn-btn{font-size:28px;line-height:36px;padding:var(--space-2) var(--space-4)}
.seg-choice .pn-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface-100)}
.specimen{font-family:"Roboto Flex",var(--font-display);margin:0}
.specimen > *{margin:0;line-height:1.15}
.specimen .srow{display:flex;align-items:baseline;gap:var(--space-4)}
.specimen .srow span{font:400 28px/1 var(--font-mono);color:var(--ink-muted);min-width:3.2ch}
.scale3{display:grid;grid-template-columns:520px 1fr 1fr;gap:var(--space-6);align-items:start}

/* line height, spacing, capitals: three adjustable samples */
.spacing .pn-card{display:flex;flex-direction:column;gap:var(--space-3)}
.spacing .sample{background:var(--surface-200);color:var(--ink);border:2px dashed var(--border-control);padding:var(--space-3) var(--space-4);margin:0;height:250px;overflow:hidden;font-family:var(--font-text);font-size:28px}
.spacing .sample.label{display:flex;align-items:center;justify-content:center;font:600 36px/1.3 var(--font-display);text-transform:uppercase}
.spacing .lbl{margin:0}
.spacing .status{margin:0;font-size:28px;line-height:38px}
.spacing .seg-choice .pn-btn{font-size:28px;padding:var(--space-1) var(--space-3)}

/* larger text: three cards */
.bigtext{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-5);align-items:start}
.bigtext .lbl{min-height:76px}
.tcard{background:var(--surface-200);border:2px solid var(--ink);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-family:var(--font-text)}
.tcard.fixed{overflow:hidden}
.tcard b{font-family:var(--font-display);display:block}

/* on/off switches, as in last week's deck */
.toggles{display:flex;flex-direction:column;gap:var(--space-3)}
.toggle{display:flex;align-items:center;gap:var(--space-4);background:none;border:0;padding:var(--space-1) 0;color:inherit;font:500 36px/44px var(--font-display);cursor:pointer;min-height:var(--target-min);text-align:left}
.toggle-track{flex:none;width:96px;height:52px;box-sizing:border-box;border-radius:var(--radius-full);border:var(--border-width) solid var(--border-control);background:var(--surface-300);position:relative}
.toggle-thumb{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:var(--radius-full);background:var(--ink-muted);transition:left .15s}
.toggle[aria-checked="true"] .toggle-track{background:var(--plum);border-color:var(--ink)}
.toggle[aria-checked="true"] .toggle-thumb{left:48px;background:var(--on-plum)}
.toggle-state{font-family:var(--font-mono);font-weight:400;font-size:28px;color:var(--ink-muted);min-width:3ch}
.toggle:focus-visible{outline:var(--focus-width) solid var(--focus);outline-offset:var(--focus-offset)}
@media (prefers-reduced-motion:reduce){.toggle-thumb{transition:none}}

/* the example site, with type variables (standard and reading mode) */
.site{background:var(--surface-100);color:var(--ink);border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);overflow:hidden;text-align:left;
  --t-body:"Source Serif 4",Georgia,serif;--t-head:"Jost",sans-serif;--t-size:28px;--t-lead:1.4;--t-track:0;--t-measure:40ch}
.site.reading{--t-body:"Roboto Flex",sans-serif;--t-head:"Roboto Flex",sans-serif;--t-size:34px;--t-lead:1.7;--t-track:.02em;--t-measure:34ch}
.site-head{background:var(--plum);color:var(--on-plum);padding:var(--space-4) var(--space-6);font:700 36px/44px var(--t-head)}
.site-main{padding:var(--space-5) var(--space-6);font-family:var(--t-body);font-size:var(--t-size);line-height:var(--t-lead);letter-spacing:var(--t-track)}
.site-main h3{font:700 1.4em/1.2 var(--t-head);margin:0 0 var(--space-3);letter-spacing:0}
.site-main p{margin:0;max-width:var(--t-measure)}
.mode-code{font:400 28px/40px var(--font-mono);margin:0}

/* variable font axes */
.axes{display:grid;grid-template-columns:1fr 1.15fr;gap:var(--space-7);align-items:start}
.axis-sample{font-family:"Roboto Flex",var(--font-display);font-size:120px;line-height:1.1;margin:0;white-space:nowrap}
.btnrow{display:flex;gap:var(--space-3);flex-wrap:wrap}

.atk{font:400 64px/80px var(--font-mono);margin:0;letter-spacing:.05em}
</style>
</head>
<body data-lecture="type" data-home="../">
<main id="stage"><div id="deck"></div></main>

<script src="../shared/pane/vendor/react.production.min.js"></script>
<script src="../shared/pane/vendor/react-dom.production.min.js"></script>
<script src="../shared/pane/components/bundle.js"></script>
<script src="../shared/deck.js"></script>
<script>
(function(){
"use strict";
var P=window.Pane,h=React.createElement,useState=React.useState;
var FOOT="KD401B · Type";
var CANVAS_EX="https://mau.instructure.com/courses/22861/pages/exercise-type-in-html-+-css";

function card(title,body,tone){return h(P.Card,{title:title,tone:tone||"paper"},body)}
function solid(title,body,fill){return h(P.Card,{title:title,className:"fill-"+fill},body)}
function p(t,cls){return h("p",cls?{className:cls}:null,t)}
function c(t){return h("code",null,t)}
function code(label,text){return h(P.CodeBlock,{size:"slide",label:label},text)}
function link(href,text){return h("a",{className:"pn-link",href:href,target:"_blank",rel:"noopener"},text)}
function stop(e){e.preventDefault()}
function round(v,d){var m=Math.pow(10,d==null?3:d);return Math.round(v*m)/m}
/* status line: never colour alone, always a symbol and a word */
function Status(props){
  return h("p",{className:"status"},h("span",{className:props.ok?"ok":"bad"},(props.ok?"✓ ":"✗ ")+props.word),props.rest?" "+props.rest:null);
}
/* a viewer's slider positions survive a reload (Deck.store, this lecture only) */
function useSaved(key,init){
  var s=useState(function(){try{var v=JSON.parse(Deck.store.get(key));return v==null?init:v}catch(e){return init}});
  return [s[0],function(v){s[1](v);Deck.store.set(key,JSON.stringify(v))}];
}

function Slider(props){
  var id="sl-"+props.id;
  return h("div",{className:"slider"},
    h("label",{htmlFor:id},h("span",null,props.label),h("output",{htmlFor:id},props.show!=null?props.show:props.value+(props.unit||""))),
    h("input",{id:id,type:"range",min:props.min,max:props.max,step:props.step||1,value:props.value,
      onChange:function(e){props.set(+e.target.value)}}));
}
function Toggle(props){
  return h("button",{type:"button",role:"switch","aria-checked":props.on?"true":"false",className:"toggle",onClick:function(){props.set(!props.on)}},
    h("span",{className:"toggle-track","aria-hidden":"true"},h("span",{className:"toggle-thumb"})),
    h("span",null,props.label),
    h("span",{className:"toggle-state","aria-hidden":"true"},props.on?"On":"Off"));
}

/* ---------- One hierarchy, three layers ---------- */
var ROLES=[
  ["s1","Heading 1","<h1>","var(--size-h1)"],
  ["s2","Heading 2","<h2>","var(--size-h2)"],
  ["s3","Body","<p>","var(--size-body)"],
  ["s4","Caption","<figcaption>","var(--size-small)"]
];
function Layers(){
  return h("div",{className:"wide"},
    h("div",{className:"layers",role:"table","aria-label":"Each text role in Figma, HTML and CSS"},
      h("div",{className:"lh",role:"columnheader"},"Figma",h("small",null,"text style")),
      h("div",{className:"lh",role:"columnheader"},"HTML",h("small",null,"element")),
      h("div",{className:"lh",role:"columnheader"},"CSS",h("small",null,"variable")),
      ROLES.map(function(r){return [
        h("div",{key:r[0]+"a",role:"cell"},h("span",{className:r[0]},r[1])),
        h("div",{key:r[0]+"b",role:"cell"},c(r[2])),
        h("div",{key:r[0]+"c",role:"cell"},c(r[3]))]})),
    p("Choose the element for what it means. The variable decides how it looks.","lead layers-note"));
}

/* ---------- Block and inline: show the boxes ---------- */
function BlockInline(){
  var s=useState(false),on=s[0];
  function B(tag,props,kids){return h(tag,Object.assign({className:"b","data-tag":"<"+tag+">"},props||{}),kids)}
  function I(tag,kids){return h(tag,{className:"i"},kids)}
  return h("div",{className:"wide demo2"},
    h("div",{className:"stack"},
      h(Toggle,{label:"Show the boxes",on:on,set:s[1]}),
      h(P.Card,{title:"Block"},p("Starts on a new line and takes the full width. h1, p, ul, li …")),
      h(P.Card,{title:"Inline"},p("Flows inside a line of text, as wide as its content. a, strong, em …"))),
    h("div",{className:"stack"},
      h("div",{className:"page flow"+(on?" show":"")},
        B("h3",null,"Colour study"),
        B("p",null,["Two palettes for ",I("strong","one page"),", and a ",h("a",{key:"a",className:"i pn-link",href:"#",tabIndex:-1,onClick:stop},"toggle")," between them."]),
        B("ul",null,[B("li",{key:1},"A light palette"),B("li",{key:2},"A dark palette")])),
      on?p("Dashed: block boxes, labelled. Solid: inline boxes.","muted"):null));
}

/* ---------- Landmark map ---------- */
var LANDMARKS={
  header:{what:"The top of the page: site name, often the nav.",sr:"“banner”"},
  nav:{what:"The main links around the site.",sr:"“navigation”"},
  main:{what:"This page's own content. One per page.",sr:"“main”"},
  section:{what:"A group of content with its own heading.",sr:"“region”, but only if it has a name, e.g. aria-labelledby"},
  article:{what:"Makes sense on its own: a post, a project.",sr:"“article”"},
  aside:{what:"Related, but not the main thing: a sidebar.",sr:"“complementary”"},
  footer:{what:"The bottom: contact, copyright.",sr:"“content info”"}
};
function LandmarkMap(){
  var s=useState("main"),sel=s[0];
  function btn(name){return h("button",{type:"button",className:"lmbtn","aria-pressed":sel===name?"true":"false",onClick:function(){s[1](name)}},"<"+name+">")}
  function cls(name,extra){return "lm "+extra+(sel===name?" on":"")}
  var info=LANDMARKS[sel];
  return h("div",{className:"wide lmap"},
    h("div",{className:"wire"},
      h("div",{className:cls("header","lm-head")},btn("header"),h("div",{className:cls("nav","")},btn("nav"))),
      h("div",{className:cls("main","lm-main")},btn("main"),
        h("div",{className:cls("section","")},btn("section"),
          h("div",{className:"lm-row"},
            h("div",{className:cls("article","lm-art")},btn("article")),

/* ===== Sizes and units ===== */
{id:"units",sec:"Sizes and units",title:"Sizes and units",

{id:"unit-families",sec:"Sizes and units",title:"Four kinds of unit",
 notes:"px is fixed: it ignores the font size the user chose in their browser. em is relative to the font size of the parent element, so it compounds when you nest. rem is relative to the root (the html element), which is the browser's default font size unless you change it: predictable. Percent is relative to the parent; vw and vh are a hundredth of the window's width and height. ch is the width of the zero character in the current font: handy for line length. Rule for today: rem for font sizes.",
 render:function(n){return h(P.ContentSlide,{title:"Four kinds of unit",number:n,footer:FOOT},
  h("div",{className:"wide units"},
    card("Absolute",h("dl",null,h("div",null,h("dt",null,"px"),h("dd",null,"Fixed. Ignores the user's font setting.")))),
    card("Font-relative",h("dl",null,
      h("div",null,h("dt",null,"em"),h("dd",null,"The parent's font size.")),
      h("div",null,h("dt",null,"rem"),h("dd",null,"The root's font size.")))),
    card("Space-relative",h("dl",null,
      h("div",null,h("dt",null,"%"),h("dd",null,"Of the parent.")),
      h("div",null,h("dt",null,"vw  vh"),h("dd",null,"1% of the window's width, height.")))),
    solid("Text",h("dl",null,h("div",null,h("dt",null,"ch"),h("dd",null,"The width of the character 0. For line length."))),"teal")))}},

{id:"em-rem",sec:"Sizes and units",title:"em compounds, rem doesn't",demo:"em vs rem",
 notes:"The word rem in the title links to a YouTube video (opens in a new tab). Both columns use 1.25 on boxes nested inside each other. With em, each box is 1.25 times its parent, so the text keeps growing: by four levels it's more than twice the size. With rem, every box is 1.25 times the root, however deep it is. That's why we use rem for the type scale. em is still useful for things that should scale with their own text, like padding on a button.",
 render:function(n){return h(P.ContentSlide,{title:[["em compounds, ",h("a",{key:"rem",className:"title-link",href:"https://www.youtube.com/watch?v=Z0GFRcFm-aY",target:"_blank",rel:"noopener"},"rem")," doesn't"]],tone:"plum",number:n,footer:FOOT},h(EmRem))}},

{id:"px-rem",sec:"Sizes and units",title:"rem follows the reader's setting",demo:"px vs rem",
 notes:"Every browser has a default font size setting, 16px out of the box. Chrome: Settings, Appearance, Font size. Firefox: Settings, Fonts, Size. Many people with low vision raise it. Move the slider: text in rem grows with the setting, text in px stays put. Demo it live afterwards in your own browser on a real site. Students can try the slider on their laptops.",
 render:function(n){return h(P.ContentSlide,{title:"rem follows the reader's setting",number:n,footer:FOOT},h(PxRem))}},

{id:"line-length",sec:"Sizes and units",title:"Line length in ch",demo:"Line length",
 notes:"Long lines are tiring: the eye loses its place on the way back to the next line. Short lines break the rhythm. Somewhere around 60 to 80 characters is comfortable for body text. In CSS, max-width in ch sets this directly, and because ch depends on the font, it stays about right when the font size changes. A line holds a few more characters than its ch value in most fonts, since many letters are narrower than a zero. Starts too long on purpose: move it into the range.",
 render:function(n){return h(P.ContentSlide,{title:"Line length in ch",number:n,footer:FOOT},h(LineLength))}},

{id:"clamp",sec:"Sizes and units",title:"Fluid type with clamp()",demo:"clamp()",
 notes:"clamp takes three values: a minimum, a preferred value and a maximum. The middle value mixes rem and vw, so the heading grows with the window but never goes below 2rem or above 4rem. Move the slider from phone width to a wide screen and watch which of the three values is in use. Keep the minimum and maximum in rem, so the reader's setting still counts. Optional for this afternoon; a fixed rem scale is fine.",
 render:function(n){return h(P.ContentSlide,{title:"Fluid type with clamp()",tone:"teal",number:n,footer:FOOT},h(Clamp))}},

{id:"google-fonts",sec:"Fonts",title:"Google Fonts: copy a link",
 notes:"The quick way. On fonts.google.com, pick the family and only the weights you need, then Get font, Get embed code. Paste the link elements into the head, before your own stylesheet, and use the family name in font-family. display=swap at the end of the address is the same as font-display: swap on the next slide. The preconnect links make it a little faster; Google's embed code includes them.",

{id:"font-face",sec:"Fonts",title:"@font-face: host it yourself",
 notes:"The other way: download the font files (woff2 is the format to use) into your repository and declare them with @font-face. Your page then doesn't depend on Google, and it works offline. This deck does exactly that for Roboto Flex. font-display: swap means: show the text right away in the fallback font, and swap in the real one when it arrives. Without it some browsers show no text at all while the font loads. A variable font gives a whole weight range from one file, so font-weight takes a range here.",
 render:function(n){return h(P.ContentSlide,{title:"@font-face: host it yourself",tone:"plum",number:n,footer:FOOT},

      p("No dependency on Google, and it works offline.","muted"))))}},

{id:"stacks",sec:"Fonts",title:"Fallbacks, and only what you use",
 notes:"A font stack is a list: if the first font can't load, the browser tries the next, and the last item is a generic family (serif, sans-serif, monospace, system-ui), which always exists. Pick fallbacks that look similar so the page doesn't jump much when the font swaps in. Performance: each weight and style of a static font is a separate file. Load only the ones you actually use, typically regular, bold and maybe italic. A variable font is one file for every weight.",
 render:function(n){return h(P.ContentSlide,{title:"Fallbacks, and only what you use",number:n,footer:FOOT},

      h("li",null,"A variable font: one file, every weight")),"plum")))}},

{id:"type-vars",sec:"Type scale",title:"Type as custom properties",

    code("style.css",'body {\n  font-family: var(--font-body);\n  font-size: var(--size-body);\n  line-height: var(--leading-body);\n}\np { max-width: var(--measure); }\nh1 {\n  font-family: var(--font-heading);\n  font-size: var(--size-h1);\n}')))}},

{id:"scale",sec:"Type scale",title:"Build a type scale",demo:"Type scale builder",ex:"Build a type scale",
 notes:"A type scale multiplies up from the body size by a fixed ratio: each step is the one below times the ratio. Small ratios (1.125, 1.2) give a calm hierarchy, good for text-heavy pages; larger ones (1.333, 1.5) give dramatic headings. Students: try to match the sizes from your Figma text styles from yesterday, then copy the CSS. Keep the body at 1rem unless you have a reason; 1rem is whatever the reader has chosen. The sizes don't have to come from a ratio: if your Figma styles have their own sizes, convert them to rem by dividing by 16.",
 render:function(n){return h(P.ContentSlide,{title:"Build a type scale",tone:"plum",number:n,footer:FOOT},h(TypeScale))}},

{id:"spacing",sec:"Type scale",title:"Line height, spacing, capitals",demo:"Spacing",
 notes:"Each card can be adjusted; students can try them on their laptops. line-height: without a unit (1.5, not 24px) it scales with the font size. Body text around 1.4 to 1.6; headings tighter, around 1.1 to 1.2, because big text with big gaps falls apart. Drag it down to 1 and up to 2.5 to show both failures. letter-spacing: switch between the label and body text. A little extra helps short labels in capitals; body text is best left alone, and negative values make letters collide. text-transform: uppercase is fine for a short label, never for paragraphs: all caps is slower to read. Write the text in normal case in the HTML and transform it in CSS; some screen readers spell out words typed in capitals letter by letter.",
 render:function(n){return h(P.ContentSlide,{title:"Line height, spacing, capitals",number:n,footer:FOOT},h(Spacing))}},

/* ===== The reader's settings ===== */
{id:"reader",sec:"The reader's settings",title:"The reader decides",
 notes:"The last part: the reader's own settings, an accessible reading mode, and variable fonts.",

{id:"settings",sec:"The reader's settings",title:"What readers change",
 notes:"Ask the room: has anyone changed one of these? Many people do, without thinking of it as accessibility. A larger default font size (people with low vision, or anyone on a big screen far away). Page zoom with Ctrl or Cmd and plus. Reader mode in Safari and Firefox, which strips the page down to its main content, and only works well if your HTML has a proper main and article. And extensions or settings that force a different font or a minimum font size. Your page should survive all four. That matters more than any toggle you build.",
 render:function(n){return h(P.ContentSlide,{title:"What readers change",tone:"plum",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    card("Default font size",p("Raised in the browser's settings.")),
    card("Zoom",p([h("kbd",{key:"k",className:"keys"},"Ctrl"),"  ",h("kbd",{key:"p",className:"keys"},"+"),"  up to 200% and more."])),
    card("Reader mode",p("Strips the page to its main content.")),
    card("Their own font",p("Extensions and settings that replace yours."))))}},

 render:function(n){return h(P.ContentSlide,{title:"What breaks when text gets bigger",number:n,footer:FOOT},h(BigText))}},

{id:"dyslexia",sec:"Reading mode",title:"What actually helps",
 notes:"Fonts marketed for dyslexia, such as OpenDyslexic and Dyslexie, have mixed research behind them: studies have generally not found that they make reading faster or more accurate, though some readers prefer them. What does help is the reading mode recipe: larger text, more space between letters, words and lines, and shorter lines. Atkinson Hyperlegible is a free font from the Braille Institute, designed for readers with low vision: letters that are easy to confuse, like capital I, lower-case l and the digit 1, are drawn clearly differently. The slide shows its monospaced cousin, which this course's design system uses for code. TODO (David): add a reference here if you want to cite a specific study.",
 render:function(n){return h(P.ContentSlide,{title:"What actually helps",number:n,footer:FOOT},

    card("Atkinson Hyperlegible",[h("p",{key:"a",className:"atk","aria-label":"Sample letters: capital I, lower-case l, digit 1, capital O, digit 0"},"Il1 O0"),p("Letters that are easy to mix up look different. Free on Google Fonts.","muted")])))}},

{id:"variable-css",sec:"Variable fonts",title:"Variable fonts in CSS",
 notes:"Johannes introduced variable fonts yesterday; this is the CSS side. A variable font is one file with axes you can set to any value. The standard axes have their own properties: font-weight for wght, font-stretch for wdth, and font-optical-sizing for opsz (on by default, so opsz follows the font size). Anything else, like Roboto Flex's grade (GRAD), goes in font-variation-settings, with the axis name in quotes. Watch out: font-variation-settings replaces the whole list, so a rule that sets only GRAD resets any opsz set elsewhere. List every axis you set each time.",
 render:function(n){return h(P.ContentSlide,{title:"Variable fonts in CSS",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    code("style.css",'h1 {\n  font-family: "Roboto Flex", sans-serif;\n  font-weight: 750;\n  font-stretch: 120%;\n  font-variation-settings: "GRAD" 50;\n}'),
    h("dl",{className:"units",style:{gridTemplateColumns:"1fr"}},
      h("div",null,h("dt",null,"wght  wdth"),h("dd",null,"font-weight, font-stretch")),
      h("div",null,h("dt",null,"opsz"),h("dd",null,"follows the size: font-optical-sizing")),
      h("div",null,h("dt",null,"GRAD and others"),h("dd",null,"font-variation-settings, all in one list")))))}},

{id:"axes",sec:"Variable fonts",title:"Roboto Flex, axis by axis",demo:"Variable font axes",
 notes:"Move each axis. Weight changes stroke thickness and the word gets wider; grade also changes thickness but the width stays the same, so text doesn't reflow. That makes grade useful for a hover state, and for dark mode, where light text on a dark background looks heavier: lower the grade a little. Optical size adjusts details for small or large text: low values open up the letters for reading at small sizes. Width saves space in tight layouts. The Reading mode button shows one way to use axes instead of switching to a different font: a bit heavier, a bit wider, opened up for text sizes. Students who made a Roboto Flex set yesterday can use this in the optional step this afternoon.",
 render:function(n){return h(P.ContentSlide,{title:"Roboto Flex, axis by axis",tone:"plum",number:n,footer:FOOT},h(Axes))}},
