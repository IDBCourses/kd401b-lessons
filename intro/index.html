<style>
/* styles used only by this lecture */

/* who we are: photos from the MAU staff pages, in a Pane-style frame (square, ink border, hard shadow) */
.person{display:flex;gap:var(--space-7);align-items:flex-start}
.photo{flex:none;display:block;width:240px;height:240px;object-fit:cover;border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);background:var(--surface-300)}
.role{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:38px;color:var(--ink-muted);margin:0 0 var(--space-2)}

/* title slide: the full course name is longer than TitleSlide's 144px frame allows,
   so this one frame is set at slide-h1 size (104px) with a slightly wider column */
#cover .pn-title{width:1200px}
#cover .pn-frame{font-size:104px!important}

/* definitions: the quoted text, and a small source line */
.def{font-style:italic}
.src{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:38px;margin-top:var(--space-4)}

/* the weeks ahead: nine week tabs need less side padding to fit on one row */
/* course calendar: one row per week; cells tinted by kind of day */
.cal{width:100%;border-collapse:separate;border-spacing:var(--space-2);margin:calc(-1 * var(--space-2));table-layout:fixed;font-family:var(--font-display)}
.cal th,.cal td{font-size:28px;line-height:34px;padding:var(--space-2) var(--space-4);text-align:left;vertical-align:middle;border-radius:var(--radius-sm)}
.cal thead th{font-weight:600;padding-top:0;padding-bottom:0}
.cal tbody th{font-weight:600;background:var(--surface-200);color:var(--ink);white-space:nowrap}
.cal tbody th b{font-weight:700}
.cal tbody th span{font-weight:500;margin-left:var(--space-3)}
.cal td{font-weight:500;color:var(--ink)}
.cal .design{background:var(--teal-tint)}
.cal .code{background:var(--plum-tint)}
.cal .a2{background:var(--pink-tint)}
.cal .off{background:var(--surface-300)}
.cal .empty{background:transparent}
.cal .due{background:var(--pink);color:var(--on-pink);font-weight:700}
.cal tr.now th{background:var(--teal);color:var(--on-teal)}
.cal col.c-week{width:23%}.cal col.c-day{width:27%}.cal col.c-due{width:23%}
/* how a week works: the same table style, larger, two rows */
.cal-week th,.cal-week td{font-size:36px;line-height:46px;padding:var(--space-5) var(--space-6)}
.cal-week thead th{font-size:36px;padding-bottom:var(--space-2)}
.cal-week td b{display:block;font-weight:700}
.cal-week td span{font-family:var(--font-text);font-weight:400}
.cal-week col.c-part{width:20%}.cal-week col.c-wday{width:40%}

/* assessment facts under a card */
.facts{font-family:var(--font-display);font-weight:500;font-size:32px;line-height:40px;margin-top:var(--space-5)}

/* spot the GUI crime: reconstructions of real interfaces, always drawn in the light theme
   (data-theme="light" on the mock-up) so they read as screenshots of ordinary web pages */
.mock{background:var(--surface-200);color:var(--ink);font-family:system-ui,sans-serif;font-size:28px;line-height:1.35;min-height:500px;position:relative}
.mock h4{margin:0;font-size:32px;font-weight:700}
.mock-alert{padding:var(--space-5) var(--space-6)}
.mock-alert ul{margin:var(--space-4) 0 0;padding:0;list-style:none}
.mock-alert li{margin:0}
.mock-alert a{color:var(--link);text-decoration:underline;font-family:"Times New Roman",serif}
.mock-cookie{display:flex;flex-direction:column;justify-content:flex-end}
.mock-cookie .page{position:absolute;inset:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.mock-cookie .page i{display:block;height:28px;background:var(--surface-300)}
.mock-cookie .banner{position:relative;background:var(--surface-100);border-top:2px solid var(--ink);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.mock-cookie .accept{align-self:stretch;font:700 40px/1 system-ui,sans-serif;padding:var(--space-6);background:var(--plum);color:var(--on-plum);border:0;border-radius:var(--radius-md)}
.mock-cookie .manage{align-self:center;font-size:28px;color:var(--ink);opacity:.45;text-decoration:underline}
.mock-shame{display:grid;place-items:center;background:var(--surface-300)}
.mock-shame .modal{width:80%;background:var(--surface-200);border:2px solid var(--ink);padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-5);text-align:center}
.mock-shame .modal h4{font-size:44px}
.mock-shame .field{border:2px solid var(--border-control);padding:var(--space-3);text-align:left;color:var(--ink-muted)}
.mock-shame .yes{font:700 32px/1 system-ui,sans-serif;padding:var(--space-5);background:var(--pink);color:var(--on-pink);border:0}
.mock-shame .no{font-size:28px;text-decoration:underline}
.mock-form{padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-5)}
.mock-form .err{background:var(--danger-bg);color:var(--danger);padding:var(--space-3) var(--space-4);font-weight:600}
.mock-form .faint{opacity:.35}
.mock-form .box{border:1px solid var(--border);padding:var(--space-3) var(--space-4)}
.mock-form button{align-self:flex-start;font:600 28px/1 system-ui,sans-serif;padding:var(--space-3) var(--space-6);background:var(--surface-300);color:var(--ink);border:1px solid var(--border);cursor:pointer}
.crime-text{display:flex;flex-direction:column;gap:var(--space-5);align-items:flex-start}
.crime-text .answer{font-size:36px;line-height:54px}

/* canvas links: the whole card is clickable through its one link */
.linkcard{position:relative}
.linkcard a{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:52px}
.linkcard a::after{content:"";position:absolute;inset:0}
.linkcard p{margin-top:var(--space-2)}

</style>

<script>
(function(){
"use strict";
var P=window.Pane,h=React.createElement,useState=React.useState;
var FOOT="KD401B · Course introduction";

function card(title,body,tone){return h(P.Card,{title:title,tone:tone||"paper"},body)}

/* ---------- Spot the GUI crime ----------

/* ---------- Course calendar ----------
   One row per ISO week, from the Course Elements database in Notion (GUIs HT26).
   Cells: [text, kind]; kind is design | code | a2 | off | empty. A span of 2 covers Thursday and Friday.
   mon: the Monday of the week, used to mark the current week. */
var CAL=[
  {wk:"46",dates:"9–13 Nov",mon:"2026-11-09",thu:["Intro, Colour","design"],fri:["HTML and CSS, colour","code"]},
  {wk:"47",dates:"16–20 Nov",mon:"2026-11-16",thu:["Type, sketching","design"],fri:["Structure, typography","code"]},
  {wk:"48",dates:"23–27 Nov",mon:"2026-11-23",thu:["Content, icons","design"],fri:["Semantic HTML, forms","code"]},
  {wk:"49",dates:"30 Nov–4 Dec",mon:"2026-11-30",thu:["Design systems, layout","design"],fri:["Components, Flexbox","code"]},
  {wk:"50",dates:"7–11 Dec",mon:"2026-12-07",span:["A2 group work, both days","a2"],due:"A2 due Fri 11"},
  {wk:"51",dates:"14–18 Dec",mon:"2026-12-14",thu:["","empty"],fri:["A2 oral exam","a2"],due:"A2 exam Fri 18"},
  {wk:"52",dates:"21–27 Dec",mon:"2026-12-21",span:["No teaching: write your A1 critique","off"]},
  {wk:"53",dates:"28 Dec–3 Jan",mon:"2026-12-28",span:["No teaching","off"],due:"A1 due Wed 30"},
  {wk:"1",dates:"4–8 Jan",mon:"2027-01-04",thu:["Intuition, motion","design"],fri:["Transitions, animation","code"]},
  {wk:"2",dates:"11–15 Jan",mon:"2027-01-11",span:["Coaching Wed 13, then portfolio work","code"],due:"A3 due Fri 15"}
];
function isThisWeek(mon){
  var start=new Date(mon+"T00:00:00"),end=new Date(start.getTime()+7*864e5),now=new Date();
  return now>=start&&now<end;
}
function Calendar(){
  return h("table",{className:"cal"},
    h("caption",{className:"pn-sr"},"Course calendar, week by week, with Thursday and Friday sessions and deadlines"),
    h("colgroup",null,h("col",{className:"c-week"}),h("col",{className:"c-day"}),h("col",{className:"c-day"}),h("col",{className:"c-due"})),
    h("thead",null,h("tr",null,
      h("th",{scope:"col"},"Week"),h("th",{scope:"col"},"Thursday · design"),h("th",{scope:"col"},"Friday · HTML and CSS"),h("th",{scope:"col"},"Deadlines and exams"))),
    h("tbody",null,CAL.map(function(w){
      var now=isThisWeek(w.mon);
      return h("tr",{key:w.wk,className:now?"now":null},
        h("th",{scope:"row"},h("b",null,w.wk),h("span",null,w.dates),now?h("span",null,"· this week"):null),
        w.span?h("td",{colSpan:2,className:w.span[1]},w.span[0])
              :[h("td",{key:"t",className:w.thu[1]},w.thu[0]),h("td",{key:"f",className:w.fri[1]},w.fri[0])],
        h("td",{className:w.due?"due":"empty"},w.due||""));
    })));
}

var CANVAS_URL="https://mau.instructure.com/courses/22861/";
var LINKS=[
  ["Modules",CANVAS_URL+"modules","Week by week, on Canvas"],
  ["Assignments",CANVAS_URL+"assignments","Briefs and deadlines, on Canvas"],
  ["Course software",CANVAS_URL+"pages/course-software","What to install, on Canvas"],
  ["Course literature",CANVAS_URL+"pages/course-literature","What to read, on Canvas"],
  ["Figma tutorials",CANVAS_URL+"pages/figma-tutorials","Getting started in Figma, on Canvas"],
  ["Syllabus","https://utbildningsinfo.mau.se/kurs/kursplan/en/cc3ff7f4-d4ec-11f0-b415-d312a71c4fd5/20262","The official course syllabus, Autumn 2026"]
];

Deck.start([
/* ===== Welcome ===== */
{id:"cover",sec:"Welcome",title:"Interaction Design: Graphical User Interfaces",
 notes:"Welcome. David leads this session; Johannes takes the parts about his Thursdays and A1/A2. Colour, with Johannes, follows straight after.",
 render:function(){return h(P.TitleSlide,{title:["Interaction","Design: Graphical","User Interfaces"],subtitle:"Course introduction",meta:"David and Johannes · KD401B HT26"})}},

{id:"who",sec:"Welcome",title:"Who we are",
 notes:"Johannes first: he teaches Thursdays, which come first each week. A sentence or two each about background. David is course coordinator: questions about the course as a whole (registration, NAIS adjustments, re-exams) go to him. Photos are from our MAU staff pages.",
 render:function(n){return h(P.ContentSlide,{title:"Who we are",tone:"plum",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    h(P.Card,null,h("div",{className:"person"},h("img",{className:"photo",src:"img/johannes.jpg",alt:"Photo of Johannes",width:240,height:240}),
      h("div",null,p("Thursdays · design","role"),h("h3",{className:"h3",style:{marginBottom:8}},"Johannes"),p("Design lectures and Figma exercises. Grades A1 and A2.")))),
    h(P.Card,null,h("div",{className:"person"},h("img",{className:"photo",src:"img/david.jpg",alt:"Photo of David",width:240,height:240}),
      h("div",null,p("Fridays · HTML and CSS","role"),h("h3",{className:"h3",style:{marginBottom:8}},"David"),p("Course coordinator. HTML and CSS lectures and exercises. Grades the portfolio."))))))}},

{id:"icebreaker",sec:"Welcome",title:"Icebreaker",
 notes:"Keep it short. Pairs first, then take two or three answers from the room. Push for the specific thing: a button that was hard to find, text too small, an error that didn't say what was wrong. Those are the things this course gives words for.",
 render:function(){return h(P.SectionSlide,{title:["Name an interface you","used today that","annoyed you."],tone:"pink",footer:"Icebreaker · Tell the person next to you what got in the way."})}},

/* ===== What is a GUI? ===== */
{id:"what-is-a-gui",sec:"What is a GUI?",title:"What is a GUI?",
 notes:"Before the course itself: what we mean by an interface, and where graphical interfaces sit among the other kinds.",
 render:function(){return h(P.SectionSlide,{title:["What is a GUI?"],tone:"ink",footer:FOOT})}},

{id:"interface",sec:"What is a GUI?",title:"What is an interface?",
 notes:"Read the three side by side. The dictionaries describe a meeting point between two things. Hookway's book (Interface, MIT Press, 2014) shifts the focus: the interface is how we relate to technology, not a thing in itself. That is the sense this course works with: designing the relation between people and what's on the screen. The Hookway line is a paraphrase of his opening argument; it isn't a direct quote.",
 render:function(n){return h(P.ContentSlide,{title:"What is an interface?",number:n,footer:FOOT},
  h("div",{className:"wide grid3"},
    h(P.Card,{title:"Wiktionary"},p("“The point of interconnection or contact between entities.”","def")),
    h(P.Card,{title:"Merriam-Webster"},p("“The place at which independent and often unrelated systems meet and act on or communicate with each other.”","def")),
    h(P.Card,{title:"Branden Hookway",className:"fill-teal"},p("An interface is a relation with technology, rather than a technology in itself."),p("Interface (2014), paraphrased","src"))))}},

{id:"kinds",sec:"What is a GUI?",title:"Kinds of interface",
 notes:"Locate graphical interfaces among the others. Ask the room for an example of each: a terminal, a tangible toy or museum installation, a smart speaker or a phone menu, and almost everything on their laptop. Many real products mix several.",
 render:function(n){return h(P.ContentSlide,{title:"Kinds of interface",tone:"teal",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    card("Command line",p("You type commands as text and read text back.")),
    card("Tangible",p("You handle physical objects that stand for digital things.")),
    card("Voice and sound",p("You speak and listen; there may be no screen at all.")),
    solid("Graphical",p("You see and point: windows, icons, menus and a pointer. This course."),"plum")))}},

/* ===== The course ===== */
{id:"about",sec:"The course",title:"What this course is about",
 notes:"Two tracks that meet every week: design and building. The topics run from colour and type through layout and interaction to accessibility.",
 render:function(n){return h(P.ContentSlide,{title:"What this course is about",tone:"plum",number:n,footer:FOOT},
  h("div",{className:"wide stack"},
    h("div",{className:"grid2"},

      solid("Building them for the screen",p("Turning those designs into real pages in HTML and CSS."),"pink")),
    h("ul",{className:"tags","aria-label":"Topics, in order"},["Colour","Type","Layout","Interaction","Accessibility"].map(function(t){return h("li",{key:t},t)}))))}},

{id:"outcomes",sec:"The course",title:"Learning outcomes",
 notes:"Quickly through the four. 1–3 are mostly Thursdays; 4 is Fridays. Each maps to an assessment. \"W3C-validated\" means it passes validator.w3.org; we use it from the first Friday.",
 render:function(n){return h(P.ContentSlide,{title:"Learning outcomes",tone:"teal",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},

    card("2. Sketch",p("to explore many different design directions.")),
    card("3. Design",p("for screens using appropriate design principles.")),
    card("4. Build",p("W3C-validated, semantically correct HTML markup and CSS."))))}},

/* ===== Structure and ways of working ===== */
{id:"three-parts",sec:"Structure",title:"Theory, design, implementation",
 notes:"The course has three strands, and each week touches all of them. Theory gives the words and the reasons; design is where you explore and decide; implementation is where it becomes real on a screen. Thursdays carry theory and design, Fridays carry implementation.",
 render:function(n){return h(P.ContentSlide,{title:"Theory, design, implementation",number:n,footer:FOOT},
  h("div",{className:"wide grid3"},
    solid("Theory",p("Why interfaces work the way they do: colour, type, layout, perception."),"teal"),
    solid("Design",p("Exploring and deciding: sketching and Figma."),"plum"),
    solid("Implementation",p("Building it for the screen: HTML and CSS."),"pink")))}},

{id:"week",sec:"Structure",title:"How a week works",
 notes:"Same shape both days: a lecture in the morning, exercises in the afternoon. Thursdays (teal) are theory and design, Fridays (plum) implementation, the same colours as the calendar. Johannes: a couple of minutes on Thursdays and how Figma runs through the exercises (there's no separate Figma workshop). David: Fridays take the same topic into code, and the Friday exercises feed the portfolio. The TAs run the afternoons: that's the place to ask questions while you work.",
 render:function(n){return h(P.ContentSlide,{title:"How a week works",number:n,footer:FOOT},
  h("div",{className:"wide"},h("table",{className:"cal cal-week"},
    h("caption",{className:"pn-sr"},"A typical week: Thursday and Friday, morning and afternoon"),
    h("colgroup",null,h("col",{className:"c-part"}),h("col",{className:"c-wday"}),h("col",{className:"c-wday"})),
    h("thead",null,h("tr",null,h("td",{className:"empty"}),
      h("th",{scope:"col"},"Thursday · theory and design"),h("th",{scope:"col"},"Friday · implementation"))),
    h("tbody",null,
      h("tr",null,h("th",{scope:"row"},"Morning"),
        h("td",{className:"design"},h("b",null,"Lecture"),h("span",null,"Johannes, on design and theory")),
        h("td",{className:"code"},h("b",null,"Lecture"),h("span",null,"David, on HTML and CSS"))),
      h("tr",null,h("th",{scope:"row"},"Afternoon"),
        h("td",{className:"design"},h("b",null,"Exercises"),h("span",null,"Figma and sketching, with the TAs")),
        h("td",{className:"code"},h("b",null,"Exercises"),h("span",null,"HTML and CSS, with the TAs")))))))}},

{id:"weeks",sec:"Structure",title:"Course calendar",

    card("Coaching",p("Feedback from us on your projects."))))}},

{id:"assessment",sec:"Assessment",title:"Assessment overview",

{id:"crime-1",sec:"Assessment",title:"Crime 1: the alert menu",ex:"Spot the GUI crime",
 notes:"Hawaii, 13 January 2018: an employee sent a real ballistic missile alert to every phone in the state. The image published afterwards (reconstructed here) shows test and live alerts as near-identical links in one plain list; officials later said it was a mock-up of the real screen, not a screenshot. The correction took 38 minutes. Who it hurts: everyone who believed it.",
 render:function(n){return h(Crime,{n:n,k:1,mock:MockAlert,
   caption:"Figure 1. Reconstruction of the alert menu published after Hawaii's false missile alert, January 2018.",

{id:"crime-2",sec:"Assessment",title:"Crime 2: the cookie banner",ex:"Spot the GUI crime",

{id:"crime-3",sec:"Assessment",title:"Crime 3: the pop-up",ex:"Spot the GUI crime",
