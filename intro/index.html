<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course introduction · KD401B Interaction Design: Graphical User Interfaces</title>
<link rel="stylesheet" href="../shared/pane/tokens/tokens.css">
<link rel="stylesheet" href="../shared/pane/components/bundle.css">
<link rel="stylesheet" href="../shared/deck.css">
<style>
/* styles used only by this lecture */

/* who we are: photos from the MAU staff pages, in a Pane-style frame (square, ink border, hard shadow) */
.person{display:flex;gap:var(--space-7);align-items:flex-start}
.photo{flex:none;display:block;width:240px;height:240px;object-fit:cover;border:2px solid var(--ink);box-shadow:var(--shadow-pane-md);background:var(--surface-300)}
.role{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:38px;color:var(--ink-muted);margin:0 0 var(--space-2)}

/* title slide: the full course name is longer than TitleSlide's 144px frame allows,
   so this one frame is set at slide-h1 size (104px) with a slightly wider column */
#cover .pn-title{width:1200px}
#cover .pn-frame{font-size:104px!important}

/* definitions: the quoted text, and a small source line */
.def{font-style:italic}
.src{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:38px;margin-top:var(--space-4)}

/* guess the year: five cards in a row that can be reordered */
.years{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--space-5)}
.years li{display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface-200);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius-lg);padding:var(--space-4);cursor:grab}
.years li.dragging{opacity:.5}
.years li.over{box-shadow:var(--shadow-pane-md);transform:translate(-4px,-4px)}
.years img{display:block;width:100%;height:160px;object-fit:contain;background:var(--surface-300);border:2px solid var(--ink)}
.years .name{font-family:var(--font-display);font-weight:600;font-size:36px;line-height:42px;margin:0}
.years .move{display:flex;gap:var(--space-2);margin-top:auto}
.years .move button{flex:1;min-height:var(--target-min);font:600 28px/1 var(--font-display);background:var(--surface-300);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius-md);cursor:pointer}
.years .move button:disabled{opacity:.4;cursor:not-allowed}
.years .year{font-family:var(--font-display);font-weight:700;font-size:56px;line-height:56px;margin:0}
.years .fact,.years .verdict{font-family:var(--font-display);font-weight:500;font-size:28px;line-height:36px;margin:0}
.yearbar{display:flex;gap:var(--space-5);align-items:center;margin-top:var(--space-5)}
.yearbar p{font-family:var(--font-display);font-weight:500;font-size:32px;line-height:40px;margin:0}
@media (prefers-reduced-motion:reduce){.years li.over{transform:none}}

/* how a week works: morning and afternoon as a definition list inside each day's card */
.day{margin:0;display:grid;grid-template-columns:auto 1fr;gap:var(--space-4) var(--space-6);align-items:baseline}
.day dt{font-family:var(--font-display);font-weight:600;font-size:32px;line-height:40px}
.day dd{margin:0}

/* the weeks ahead: nine week tabs need less side padding to fit on one row */
#weeks .pn-tab{padding-left:var(--space-4);padding-right:var(--space-4)}

/* assessment facts under a card */
.facts{font-family:var(--font-display);font-weight:500;font-size:32px;line-height:40px;margin-top:var(--space-5)}

/* spot the GUI crime: reconstructions of real interfaces, always drawn in the light theme
   (data-theme="light" on the mock-up) so they read as screenshots of ordinary web pages */
.mock{background:var(--surface-200);color:var(--ink);font-family:system-ui,sans-serif;font-size:28px;line-height:1.35;min-height:500px;position:relative}
.mock h4{margin:0;font-size:32px;font-weight:700}
.mock-alert{padding:var(--space-5) var(--space-6)}
.mock-alert ul{margin:var(--space-4) 0 0;padding:0;list-style:none}
.mock-alert li{margin:0}
.mock-alert a{color:var(--link);text-decoration:underline;font-family:"Times New Roman",serif}
.mock-cookie{display:flex;flex-direction:column;justify-content:flex-end}
.mock-cookie .page{position:absolute;inset:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.mock-cookie .page i{display:block;height:28px;background:var(--surface-300)}
.mock-cookie .banner{position:relative;background:var(--surface-100);border-top:2px solid var(--ink);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5)}
.mock-cookie .accept{align-self:stretch;font:700 40px/1 system-ui,sans-serif;padding:var(--space-6);background:var(--plum);color:var(--on-plum);border:0;border-radius:var(--radius-md)}
.mock-cookie .manage{align-self:center;font-size:28px;color:var(--ink);opacity:.45;text-decoration:underline}
.mock-shame{display:grid;place-items:center;background:var(--surface-300)}
.mock-shame .modal{width:80%;background:var(--surface-200);border:2px solid var(--ink);padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-5);text-align:center}
.mock-shame .modal h4{font-size:44px}
.mock-shame .field{border:2px solid var(--border-control);padding:var(--space-3);text-align:left;color:var(--ink-muted)}
.mock-shame .yes{font:700 32px/1 system-ui,sans-serif;padding:var(--space-5);background:var(--pink);color:var(--on-pink);border:0}
.mock-shame .no{font-size:28px;text-decoration:underline}
.mock-form{padding:var(--space-7);display:flex;flex-direction:column;gap:var(--space-5)}
.mock-form .err{background:var(--danger-bg);color:var(--danger);padding:var(--space-3) var(--space-4);font-weight:600}
.mock-form .faint{opacity:.35}
.mock-form .box{border:1px solid var(--border);padding:var(--space-3) var(--space-4)}
.mock-form button{align-self:flex-start;font:600 28px/1 system-ui,sans-serif;padding:var(--space-3) var(--space-6);background:var(--surface-300);color:var(--ink);border:1px solid var(--border);cursor:pointer}
.crime-text{display:flex;flex-direction:column;gap:var(--space-5);align-items:flex-start}
.crime-text .answer{font-size:36px;line-height:54px}

/* canvas links: the whole card is clickable through its one link */
.linkcard{position:relative}
.linkcard a{font-family:var(--font-display);font-weight:600;font-size:44px;line-height:52px}
.linkcard a::after{content:"";position:absolute;inset:0}
.linkcard p{margin-top:var(--space-2)}

/* image credits */
.credits{margin:0;padding-left:1.1em;font-size:32px;line-height:46px}
.credits li{margin-bottom:var(--space-2)}
</style>
</head>

<script src="../shared/pane/vendor/react.production.min.js"></script>

<script>
(function(){
"use strict";
var P=window.Pane,h=React.createElement,useState=React.useState;
var FOOT="KD401B · Course introduction";

function card(title,body,tone){return h(P.Card,{title:title,tone:tone||"paper"},body)}
/* solid-colour card (see "Solid-fill cards" in shared/deck.css): fill is plum | teal | pink */
function solid(title,body,fill){return h(P.Card,{title:title,className:"fill-"+fill},body)}
function p(t,cls){return h("p",cls?{className:cls}:null,t)}

/* ---------- Guess the year ----------
   Photos from Wikimedia Commons; licences and authors are on the "Image credits" slide. */
var INTERFACES=[
  {id:"alto",name:"Xerox Alto",year:1973,img:"img/year-alto.jpg",alt:"The Xerox Alto: a tall portrait-format screen, keyboard and mouse",
   fact:"A research computer at Xerox PARC with windows, a mouse and a bitmap screen."},
  {id:"mac",name:"Apple Macintosh",year:1984,img:"img/year-mac.jpg",alt:"The original Apple Macintosh: a beige all-in-one computer with a small screen",
   fact:"Brought the mouse and the desktop to a mass-market computer."},
  {id:"win95",name:"Windows 95",year:1995,img:"img/year-win95.jpg",alt:"A laptop and monitor showing the Windows 95 Setup screen, next to a stack of floppy disks",
   fact:"Introduced the Start button and the taskbar."},
  {id:"iphone",name:"iPhone",year:2007,img:"img/year-iphone.jpg",alt:"The first iPhone: a phone that is almost all touchscreen",
   fact:"A multi-touch screen in place of a keyboard and stylus."},
  {id:"echo",name:"Amazon Echo",year:2014,img:"img/year-echo.jpg",alt:"The Amazon Echo: a black cylindrical speaker",
   fact:"A voice assistant with no screen at all."}
];
var START=["iphone","alto","echo","win95","mac"];
var BY_ID={};INTERFACES.forEach(function(x){BY_ID[x.id]=x});
var CORRECT=INTERFACES.map(function(x){return x.id});
var ORD=["1st","2nd","3rd","4th","5th"];

function GuessYear(){
  var st=useState(START),order=st[0],setOrder=st[1];
  var rv=useState(false),revealed=rv[0],setRevealed=rv[1];
  var dg=useState(null),drag=dg[0],setDrag=dg[1];
  var ov=useState(null),over=ov[0],setOver=ov[1];
  function move(from,to){
    if(to<0||to>=order.length||from===to)return;
    var o=order.slice(),x=o.splice(from,1)[0];o.splice(to,0,x);setOrder(o);
  }
  var right=order.filter(function(id,i){return CORRECT[i]===id}).length;
  return h("div",null,
    h("ol",{className:"years","aria-label":"Interfaces, from earliest to latest"},order.map(function(id,i){
      var x=BY_ID[id];
      return h("li",{key:id,draggable:true,"data-noswipe":true,
          className:(drag===i?"dragging":"")+(over===i&&drag!==i?" over":""),
          onDragStart:function(e){setDrag(i);try{e.dataTransfer.setData("text/plain",id)}catch(_){}},
          onDragOver:function(e){e.preventDefault();if(over!==i)setOver(i)},
          onDragLeave:function(){if(over===i)setOver(null)},
          onDrop:function(e){e.preventDefault();if(drag!=null)move(drag,i);setDrag(null);setOver(null)},
          onDragEnd:function(){setDrag(null);setOver(null)}},
        h("img",{src:x.img,alt:x.alt,draggable:false}),
        h("p",{className:"name"},x.name),
        revealed&&h("p",{className:"year"},x.year),
        revealed&&h("p",{className:"fact"},x.fact),
        revealed&&h("p",{className:"verdict"},CORRECT[i]===id?"✓ Right place":"✗ Belongs "+ORD[CORRECT.indexOf(id)]),
        !revealed&&h("div",{className:"move"},
          h("button",{type:"button",onClick:function(){move(i,i-1)},disabled:i===0,"aria-label":"Move "+x.name+" earlier"},"←"),
          h("button",{type:"button",onClick:function(){move(i,i+1)},disabled:i===order.length-1,"aria-label":"Move "+x.name+" later"},"→")));
    })),
    h("div",{className:"yearbar"},
      revealed
        ? [h(P.Button,{key:"again",variant:"secondary",onClick:function(){setOrder(START);setRevealed(false)}},"Start again"),
           h("p",{key:"score",role:"status"},right+" of 5 in the right place.")]
        : [h(P.Button,{key:"reveal",onClick:function(){setRevealed(true)}},"Reveal the years"),
           h("p",{key:"hint"},"Drag the cards, or use the arrows, to put them in order: earliest first.")]));
}

/* ---------- Spot the GUI crime ----------
   Each mock-up is a reconstruction, drawn in the light theme so it reads like an ordinary web page. */
var ALERT_ITEMS=["BMD False Alarm","Amber Alert (CAE) - Kauai County Only","Amber Alert DEMO TEST","High Surf Warning North Shores","PACOM (CDW) - STATE ONLY","TSUNAMI WARNING (CEM) - STATE ONLY","DRILL - PACOM (CDW) - STATE ONLY","Landslide - Hanalei Road Closure","Amber Alert (CAE) Statewide","1. TEST Message","PACOM (DEMO) - STATE ONLY"];
function MockAlert(){
  return h("div",{className:"mock mock-alert","data-theme":"light"},
    h("h4",null,"Select an alert to send"),
    h("ul",null,ALERT_ITEMS.map(function(t){return h("li",{key:t},h("a",{href:"#",onClick:function(e){e.preventDefault()},tabIndex:-1},t))})));
}
function MockCookie(){
  return h("div",{className:"mock mock-cookie","data-theme":"light"},
    h("div",{className:"page","aria-hidden":true},h("i",null),h("i",null),h("i",{style:{width:"70%"}})),
    h("div",{className:"banner"},
      h("p",{style:{margin:0}},"We value your privacy. We use cookies to improve your experience and for marketing."),
      h("button",{type:"button",className:"accept",tabIndex:-1},"Accept all"),
      h("span",{className:"manage"},"Manage settings")));
}
function MockShame(){
  return h("div",{className:"mock mock-shame","data-theme":"light"},
    h("div",{className:"modal"},
      h("h4",null,"Get 10% off your first order"),
      h("div",{className:"field"},"Your email address"),
      h("button",{type:"button",className:"yes",tabIndex:-1},"Yes, give me 10% off"),
      h("span",{className:"no"},"No thanks, I don't like saving money")));
}
function MockForm(){
  var s=useState(false),sent=s[0],setSent=s[1];
  return h("div",{className:"mock mock-form","data-theme":"light"},
    h("h4",null,"Create an account"),
    sent&&h("div",{className:"err",role:"status"},"Error: invalid input."),
    h("div",{className:"box faint"},"Email"),
    h("div",{className:"box faint"},"Password"),
    h("p",{className:"faint",style:{margin:0}},"Password must meet the requirements."),
    h("button",{type:"button",onClick:function(){setSent(true)}},"Submit"));
}
function Crime(props){
  var s=useState(false),shown=s[0],setShown=s[1];
  return h(P.FigureSlide,{title:"Spot the GUI crime: "+props.k+" of 4",number:props.n,footer:FOOT+" · Johannes",
      figure:h(props.mock),caption:props.caption},
    h("div",{className:"crime-text"},
      shown?p(props.answer,"answer"):p(props.prompt||"What's wrong here, and who does it hurt?","answer"),
      h(P.Button,{variant:shown?"secondary":"primary",onClick:function(){setShown(!shown)}},shown?"Hide the answer":"Show the crime")));
}

/* ---------- The weeks ahead ----------
   Dates and sessions from the Course Elements database in Notion (GUIs HT26). Card: [title, text, fill]. */
var WEEKS=[
  {id:"46",label:"Week 46",topic:"Colour",cards:[
    ["Thu 12 Nov · design","Course introduction, then Colour. Exercise: colour in Figma.","teal"],
    ["Fri 13 Nov · HTML and CSS","Introduction to HTML and CSS, colour in CSS. Exercise: colour in HTML and CSS.","plum"]]},
  {id:"47",label:"Week 47",topic:"Type, sketching and design process",cards:[
    ["Thu 19 Nov · design","Type, then sketching and the design process. Exercise: type and sketching in Figma.","teal"],
    ["Fri 20 Nov · HTML and CSS","HTML document structure and CSS typography. Exercise: type in HTML and CSS.","plum"]]},
  {id:"48",label:"Week 48",topic:"Content and UX writing, icons",cards:[
    ["Thu 26 Nov · design","Content and UX writing, then icons and symbols. Exercise: content and icons in Figma.","teal"],
    ["Fri 27 Nov · HTML and CSS","Semantic HTML, forms and SVG icons. Exercise: semantic HTML, forms and icons.","plum"]]},
  {id:"49",label:"Week 49",topic:"Design systems, composition and layout",cards:[
    ["Thu 3 Dec · design","Consistency and design systems, then composition and layout. Exercise in Figma.","teal"],
    ["Fri 4 Dec · HTML and CSS","CSS custom properties, components and Flexbox. Exercise: components and layout.","plum"]]},
  {id:"50",label:"Week 50",topic:"Group work on your A2 project",cards:[
    ["Thu 10 Dec","A full day of group work sessions on your A2 design activity, with us there to help.","pink"],
    ["Fri 11 Dec","Another day of group work sessions. A2 is due at the end of the day.","pink"]]},
  {id:"51",label:"Week 51",topic:"A2 oral exam",cards:[
    ["Fri 18 Dec","You present and discuss your A2 design as a group. Groups are split between morning and afternoon.","pink"]]},
  {id:"52",label:"Week 52",topic:"Work on your A1 critique",cards:[
    ["No teaching","Time to write your A1 critical analysis of an interface. A1 is due on Wednesday 30 Dec.","teal"]]},
  {id:"1",label:"Week 1",topic:"Designing for intuition, animation and motion",cards:[
    ["Thu 7 Jan · design","Designing for intuition, then animation, motion and space. Exercise in Figma.","teal"],
    ["Fri 8 Jan · HTML and CSS","CSS states, transitions and animation. Exercise: interaction and motion in HTML and CSS.","plum"]]},
  {id:"2",label:"Week 2",topic:"Portfolio",cards:[
    ["Wed 13 Jan","Portfolio coaching.","plum"],
    ["Thu 14 – Fri 15 Jan","Portfolio work sessions. A3 is due on Friday 15 Jan.","plum"]]}
];
var weekTabs=WEEKS.map(function(w){return {id:w.id,label:w.label,content:h("div",null,
  h("h3",{className:"h3"},w.topic),
  h("div",{className:"grid2"},w.cards.map(function(c){return h(P.Card,{key:c[0],title:c[0],className:"fill-"+c[2]},p(c[1]))})))}});

var CANVAS_URL="https://mau.instructure.com/courses/22861/";
var LINKS=[
  ["Modules",CANVAS_URL+"modules","Week by week, on Canvas"],
  ["Assignments",CANVAS_URL+"assignments","Briefs and deadlines, on Canvas"],
  ["Course software",CANVAS_URL+"pages/course-software","What to install, on Canvas"],
  ["Course literature",CANVAS_URL+"pages/course-literature","What to read, on Canvas"],
  ["Figma tutorials",CANVAS_URL+"pages/figma-tutorials","Getting started in Figma, on Canvas"],
  ["Syllabus","https://utbildningsinfo.mau.se/kurs/kursplan/en/cc3ff7f4-d4ec-11f0-b415-d312a71c4fd5/20262","The official course syllabus, Autumn 2026"]
];

/* Image credits for the "Guess the year" photos (Wikimedia Commons). */
var COMMONS="https://commons.wikimedia.org/wiki/File:";
var CREDITS=[
  ["Xerox Alto","Bc4040","CC BY 4.0","Xero_Alto_Computer.jpg"],
  ["Apple Macintosh","Sailko","CC BY 3.0","Computer_macintosh_128k,_1984_(all_about_Apple_onlus).jpg"],
  ["Windows 95 (setup on a Toshiba T1850)","Hanul from Germany","CC BY 2.0","Toshiba_T1850_-_Windows_95_Setup_(5171002135).jpg"],
  ["iPhone","Carl Berkeley","CC BY-SA 2.0","IPhone_First_Generation_8GB_(3677961514).jpg"],
  ["Amazon Echo","Frmorrison","CC BY-SA 3.0","Amazon_Echo.jpg"]
];

Deck.start([
/* ===== Welcome ===== */
{id:"cover",sec:"Welcome",title:"Interaction Design: Graphical User Interfaces",
 notes:"Welcome. David leads this session; Johannes takes the parts about his Thursdays and A1/A2. Colour, with Johannes, follows straight after.",
 render:function(){return h(P.TitleSlide,{title:["Interaction","Design: Graphical","User Interfaces"],subtitle:"Course introduction",meta:"David and Johannes · KD401B HT26"})}},

{id:"who",sec:"Welcome",title:"Who we are",
 notes:"Johannes first: he teaches Thursdays, which come first each week. A sentence or two each about background. David is course coordinator: questions about the course as a whole (registration, NAIS adjustments, re-exams) go to him. Photos are from our MAU staff pages.",
 render:function(n){return h(P.ContentSlide,{title:"Who we are",tone:"plum",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    h(P.Card,null,h("div",{className:"person"},h("img",{className:"photo",src:"img/johannes.jpg",alt:"Photo of Johannes",width:240,height:240}),
      h("div",null,p("Thursdays · design","role"),h("h3",{className:"h3",style:{marginBottom:8}},"Johannes"),p("Design lectures and Figma exercises. Grades A1 and A2.")))),
    h(P.Card,null,h("div",{className:"person"},h("img",{className:"photo",src:"img/david.jpg",alt:"Photo of David",width:240,height:240}),
      h("div",null,p("Fridays · HTML and CSS","role"),h("h3",{className:"h3",style:{marginBottom:8}},"David"),p("Course coordinator. HTML and CSS lectures and exercises. Grades the portfolio."))))))}},

{id:"icebreaker",sec:"Welcome",title:"Icebreaker",
 notes:"Keep it short. Pairs first, then take two or three answers from the room. Push for the specific thing: a button that was hard to find, text too small, an error that didn't say what was wrong. Those are the things this course gives words for.",
 render:function(){return h(P.SectionSlide,{title:["Name an interface you","used today that","annoyed you."],tone:"pink",footer:"Icebreaker · Tell the person next to you what got in the way."})}},

/* ===== What is a GUI? ===== */
{id:"what-is-a-gui",sec:"What is a GUI?",title:"What is a GUI?",
 notes:"Before the course itself: what we mean by an interface, and where graphical interfaces sit among the other kinds.",
 render:function(){return h(P.SectionSlide,{title:["What is a GUI?"],tone:"ink",footer:FOOT})}},

{id:"interface",sec:"What is a GUI?",title:"What is an interface?",
 notes:"Read the three side by side. The dictionaries describe a meeting point between two things. Hookway's book (Interface, MIT Press, 2014) shifts the focus: the interface is how we relate to technology, not a thing in itself. That is the sense this course works with: designing the relation between people and what's on the screen. The Hookway line is a paraphrase of his opening argument; it isn't a direct quote.",
 render:function(n){return h(P.ContentSlide,{title:"What is an interface?",number:n,footer:FOOT},
  h("div",{className:"wide grid3"},
    h(P.Card,{title:"Wiktionary"},p("“The point of interconnection or contact between entities.”","def")),
    h(P.Card,{title:"Merriam-Webster"},p("“The place at which independent and often unrelated systems meet and act on or communicate with each other.”","def")),
    h(P.Card,{title:"Branden Hookway",className:"fill-teal"},p("An interface is a relation with technology, rather than a technology in itself."),p("Interface (2014), paraphrased","src"))))}},

{id:"kinds",sec:"What is a GUI?",title:"Kinds of interface",
 notes:"Locate graphical interfaces among the others. Ask the room for an example of each: a terminal, a tangible toy or museum installation, a smart speaker or a phone menu, and almost everything on their laptop. Many real products mix several.",
 render:function(n){return h(P.ContentSlide,{title:"Kinds of interface",tone:"teal",number:n,footer:FOOT},
  h("div",{className:"wide grid2"},
    card("Command line",p("You type commands as text and read text back.")),
    card("Tangible",p("You handle physical objects that stand for digital things.")),
    card("Voice and sound",p("You speak and listen; there may be no screen at all.")),
    solid("Graphical",p("You see and point: windows, icons, menus and a pointer. This course."),"plum")))}},

{id:"guess-the-year",sec:"What is a GUI?",title:"Guess the year",ex:"Guess the year",
 notes:"Students open the same link on their laptops and put the five interfaces in order, earliest first; drag the cards or use the arrow buttons. Give them a minute, then reveal on the projector and ask who got all five. Years: Xerox Alto 1973, Macintosh 1984, Windows 95 1995, iPhone 2007, Amazon Echo 2014. The point: graphical interfaces are about 50 years old, and the newest one here has no screen at all.",
 render:function(n){return h(P.ContentSlide,{title:"Guess the year",number:n,footer:FOOT+" · Photos: Wikimedia Commons, credits at the end"},
  h("div",{className:"wide"},h(GuessYear)))}},

/* ===== The course ===== */
{id:"about",sec:"The course",title:"What this course is about",
 notes:"Two tracks that meet every week: design and building. The topics run from colour and type through layout and interaction to accessibility.",
 render:function(n){return h(P.ContentSlide,{title:"What this course is about",tone:"plum",number:n,footer:FOOT},
  h("div",{className:"wide stack"},
    h("div",{className:"grid2"},
      solid("Designing graphical user interfaces",p("Looking closely at interfaces, sketching alternatives, and making considered design decisions."),"teal"),
      solid("Building them for the screen",p("Turning those designs into real pages in HTML and CSS."),"pink")),
    h("ul",{className:"tags","aria-label":"Topics, in order"},["Colour","Type","Layout","Interaction","Accessibility"].map(function(t){return h("li",{key:t},t)}))))}},

{id:"outcomes",sec:"The course",title:"Learning outcomes",
 notes:"Quickly through the four. 1–3 are mostly Thursdays; 4 is Fridays. Each maps to an assessment. \"W3C-validated\" means it passes validator.w3.org; we use it from the first Friday.",
 render:function(n){return h(P.ContentSlide,{title:"Learning outcomes",tone:"teal",number:n,footer:FOOT},

    solid("Design",p("Exploring and deciding: sketching and Figma."),"plum"),
    solid("Implementation",p("Building it for the screen: HTML and CSS."),"pink")))}},

{id:"crime",sec:"Assessment",title:"Spot the GUI crime",ex:"Spot the GUI crime",

{id:"crime-1",sec:"Assessment",title:"Crime 1: the alert menu",ex:"Spot the GUI crime",
 notes:"Hawaii, 13 January 2018: an employee sent a real ballistic missile alert to every phone in the state. The image published afterwards (reconstructed here) shows test and live alerts as near-identical links in one plain list; officials later said it was a mock-up of the real screen, not a screenshot. The correction took 38 minutes. Who it hurts: everyone who believed it.",
 render:function(n){return h(Crime,{n:n,k:1,mock:MockAlert,
   caption:"Figure 1. Reconstruction of the alert menu published after Hawaii's false missile alert, January 2018.",
   answer:"Test and live alerts sit in one list of look-alike links. A real missile alert to the whole state was one click and a generic “are you sure?” away. The correction took 38 minutes."})}},

{id:"crime-2",sec:"Assessment",title:"Crime 2: the cookie banner",ex:"Spot the GUI crime",
 notes:"A common pattern rather than one site. Who it hurts: anyone who wanted to say no and clicked the big button to get rid of the banner.",
 render:function(n){return h(Crime,{n:n,k:2,mock:MockCookie,
   caption:"Figure 2. Reconstruction of a typical cookie banner.",
   answer:"The two choices aren't equal. “Accept all” is a big bright button; refusing is a small grey link that leads to more clicks. The visual hierarchy pushes you one way: a dark pattern."})}},

{id:"crime-3",sec:"Assessment",title:"Crime 3: the pop-up",ex:"Spot the GUI crime",
 notes:"Known as confirmshaming. The design itself can look tidy; the crime is in the words.",
 render:function(n){return h(Crime,{n:n,k:3,mock:MockShame,
   caption:"Figure 3. Reconstruction of a typical sign-up pop-up.",
   answer:"To say no, you have to insult yourself. The copy uses guilt as pressure: this is called confirmshaming."})}},

{id:"crime-4",sec:"Assessment",title:"Crime 4: the form",ex:"Spot the GUI crime",
 notes:"Press Submit in the mock-up to show the error. Who it hurts: people with low vision, anyone on a bright screen outdoors, everyone who has to guess what went wrong.",
 render:function(n){return h(Crime,{n:n,k:4,mock:MockForm,
   caption:"Figure 4. Reconstruction of a typical sign-up form. Press Submit.",
   prompt:"What's wrong here, and who does it hurt? Try pressing Submit.",
   answer:"Light grey text is hard to read, the labels are only placeholders, and the error appears only after you submit, without saying which field is wrong or how to fix it."})}},
