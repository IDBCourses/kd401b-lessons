# Publishes the site to GitHub Pages with GitHub Actions, with a preview of every open pull request.
#
# GitHub Pages (Actions source) serves one site at a time, so every run rebuilds all of it:
#   /                     main
#   /pr-preview/pr-<N>/   the head of each open pull request from this repository
#
# Triggers:
#   - a push to main
#   - "PR preview trigger" (pr-preview-trigger.yml) finishing, which happens whenever a pull request is
#     opened, updated, reopened or closed. workflow_run always runs this file from main, so the
#     github-pages environment accepts the deployment, and pull request code is only copied, never run.
#   - by hand, from the Actions tab
# The preview link is posted on the pull request and updated on each push.
#
# Repo settings needed once:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   Settings → Environments → github-pages → Deployment branches and tags: allow "main"
name: Deploy site and PR previews

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["PR preview trigger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

# One deployment at a time. A queued run is replaced by a newer one, which rebuilds everything anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # previews only for pull requests from this repository, not forks
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Collect main
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude _site \
            --exclude tools --exclude docs --exclude CLAUDE.md --exclude pr-preview ./ _site/

      - name: Collect open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open --limit 100 \
            --json number,headRepository,headRepositoryOwner \
            --jq '.[] | select(.headRepositoryOwner.login + "/" + .headRepository.name == env.REPO) | .number' \
            > prs.txt
          while read -r n; do
            [ -z "$n" ] && continue
            echo "Preview for #$n"
            git fetch --quiet origin "refs/pull/$n/head:pr-$n"
            dest="_site/pr-preview/pr-$n"
            mkdir -p "$dest"
            git archive "pr-$n" | tar -x -C "$dest"
            rm -rf "$dest/.github" "$dest/.claude" "$dest/tools" "$dest/docs" "$dest/CLAUDE.md"
          done < prs.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Post the preview link on the pull request
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            // find the pull request this run was for, by its branch and commit
            const prs = await github.paginate(github.rest.pulls.list,
              { owner, repo, state: 'all', head: `${owner}:${run.head_branch}`, per_page: 100 });
            const pr = prs.find(p => p.head.sha === run.head_sha) || prs[0];
            if (!pr) { core.info('No pull request found for this run.'); return; }
            const marker = '<!-- pr-preview -->';
            const url = `${process.env.PAGE_URL.replace(/\/?$/, '/')}pr-preview/pr-${pr.number}/`;
            const body = pr.state === 'closed'
              ? `${marker}\nPreview removed because this pull request is closed.`
              : `${marker}\n**Preview:** ${url}\n\nUpdated for ${run.head_sha.slice(0, 7)}. It can take a minute to appear.`;
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: pr.number, per_page: 100 });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
